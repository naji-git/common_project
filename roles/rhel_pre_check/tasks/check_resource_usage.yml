---
# --------------------------------------------------
# 0.事前確認エビデンスディレクトリの準備（既存退避 & 新規作成）
# --------------------------------------------------
- name: "Check if evidence directory already exists"
  ansible.builtin.stat:
    path: "{{ patch_evidence_dir }}"
  register: __rhel_pre_check_existing_evidence_dir
 
- name: "Backup and rename existing evidence directory"
  when: __rhel_pre_check_existing_evidence_dir['stat']['exists'] | bool
  block:
    # 既存ディレクトリをタイムスタンプ付きでリネーム退避するため command を使用
    - name: "Rename existing evidence directory with timestamp"
      ansible.builtin.command: >-
        mv "{{ patch_evidence_dir }}" "{{ patch_evidence_dir }}_backup_{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
      register: __rhel_pre_check_backup_result
      changed_when: true
 
    - name: "Display message for renamed evidence directory"
      ansible.builtin.debug:
        msg: "[NOTICE] 前回の作業ディレクトリが残っていたため、バックアップとしてリネーム退避しました: {{ patch_evidence_dir }}_backup_{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
 
- name: "Create fresh evidence directory for pre-check"
  ansible.builtin.file:
    path: "{{ patch_evidence_dir }}"
    state: directory
    mode: "0755"
 
# ==================================================
# 事前リソース使用状況の確認
# ==================================================
# --------------------------------------------------
# 1. CPU使用率確認
# --------------------------------------------------
# 過去ログを含めた sar 全体出力をエビデンス化するため command を使用
- name: "Get sar CPU usage logs before patch"
  ansible.builtin.command: sar -u
  register: __rhel_pre_check_cpu_usage
  changed_when: false
 
- name: "Save CPU usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_pre_check_cpu_usage['stdout'] }}\n"
    dest: "{{ patch_evidence_dir }}/cpu_usage_before"
    mode: "0644"
 
# --------------------------------------------------
# 2. メモリ使用率確認
# --------------------------------------------------
# 当日の sar メモリログ全体をエビデンス化（CPUの sar -u と粒度を統一）するため command を使用
- name: "Get sar memory usage logs before patch"
  ansible.builtin.command: sar -r
  register: __rhel_pre_check_mem_usage
  changed_when: false
 
- name: "Save memory usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_pre_check_mem_usage['stdout'] }}\n"
    dest: "{{ patch_evidence_dir }}/mem_usage_before"
    mode: "0644"
 
# --------------------------------------------------
# 3. ディスク使用率確認
# --------------------------------------------------
# システム全体のディスク構成・使用状況をエビデンス化するため command を使用
- name: "Get disk usage logs before patch"
  ansible.builtin.command: df -h
  register: __rhel_pre_check_disk_usage
  changed_when: false
 
- name: "Save disk usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_pre_check_disk_usage['stdout'] }}\n"
    dest: "{{ patch_evidence_dir }}/disk_usage_before"
    mode: "0644"
 
# ==================================================
# 4. RHEL 7 専用: /boot 容量確保 (kernel-debug 削除)
# 対象: RHEL 7 かつ ホスト名が "SV" から始まる仮想基盤のサーバ
# ==================================================
- name: "Ensure boot partition space on RHEL 7 (SV hosts only)"
  when:
    - ansible_facts['distribution_major_version'] == "7"
    - ansible_facts['hostname'] is match('^SV.*')
  block:
    # 1. 稼働中カーネルが debug ではないことを Facts で確認
    - name: "Assert running kernel is not a debug kernel"
      ansible.builtin.assert:
        that:
          - "'debug' not in ansible_facts['kernel']"
        fail_msg: >-
          [ERROR] 現在 kernel-debug ({{ ansible_facts['kernel'] }}) で起動しているため削除できません。
          grubby 等でデフォルトカーネルを通常カーネルに設定し、再起動後に作業を再実行してください。

    # 2. パッチディレクトリ内に kernel-debug パッケージが存在するか確認
    - name: "Check if kernel-debug RPM exists in patch directory"
      ansible.builtin.find:
        paths: "{{ patch_storage_dir }}"
        patterns: "kernel-debug-*.rpm"
      register: __rhel_patch_kernel_debug_files

    # 3. パッチ配下に kernel-debug が存在しない場合のスキップメッセージ通知
    - name: "Notify skip of /boot cleanup when kernel-debug RPM is not found"
      when: __rhel_patch_kernel_debug_files.matched == 0
      ansible.builtin.debug:
        msg: "対象がRHEL 7の仮想基盤のサーバですが「{{ patch_storage_dir }}」に kernel-debugのパッケージがない為、/bootの空き容量処理はスキップします"

    # 4. パッチ配下に kernel-debug がある場合のみ削除処理を実施
    - name: "Handle kernel-debug removal for /boot capacity"
      when: __rhel_patch_kernel_debug_files.matched > 0
      block:
        # パッケージ情報を構造化データとして取得
        - name: "Gather package facts before removal"
          ansible.builtin.package_facts:
            manager: rpm

        # インストール済みの kernel-debug 関連パッケージ名（削除用）を抽出
        - name: "Set fact for installed kernel-debug packages"
          ansible.builtin.set_fact:
            __rhel_installed_kernel_debug_pkgs: >-
              {{
                ansible_facts['packages'].keys()
                | select('match', '^kernel-debug.*')
                | list
              }}

        - name: "Remove existing kernel-debug packages if installed"
          when: __rhel_installed_kernel_debug_pkgs | length > 0
          block:
            # 削除前の /boot 空き容量を取得 (MB単位: /boot が単独マウントされていなければ / を参照)
            - name: "Record /boot free space before removal"
              ansible.builtin.set_fact:
                __rhel_boot_free_mb_before: >-
                  {{
                    (
                      (
                        (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/boot') | list)
                        or
                        (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | list)
                      )
                      | map(attribute='size_available')
                      | first
                      / 1024 / 1024
                    ) | round(2)
                  }}

            # 削除前の全パッケージリスト（テキスト用リスト変数作成）
            - name: "Build package full names list before removal"
              ansible.builtin.set_fact:
                __rhel_pkgs_list_before: >-
                  [
                    {% for pkg_name, pkg_list in ansible_facts['packages'] | dictsort %}
                    {% for item in pkg_list %}
                    "{{ pkg_name }}-{{ item.version }}-{{ item.release }}.{{ item.arch }}",
                    {% endfor %}
                    {% endfor %}
                  ]

            # 削除前の全パッケージリスト（エビデンスファイル出力）
            - name: "Save package list before removal"
              ansible.builtin.copy:
                content: "{{ __rhel_pkgs_list_before | join('\n') }}\n"
                dest: "{{ patch_evidence_dir }}/supports_boot_rpm_qa_before"
                mode: "0644"

            # 複数世代が共存していても全削除できるよう --allmatches を指定
            - name: "Remove installed kernel-debug packages"
              ansible.builtin.command:
                argv: >-
                  {{ ['rpm', '-e', '--allmatches'] + __rhel_installed_kernel_debug_pkgs }}
              register: __rhel_rpm_remove_result
              changed_when: __rhel_rpm_remove_result.rc == 0

            # 削除後のマウント情報とパッケージ情報を再収集
            - name: "Re-collect facts after removal"
              ansible.builtin.setup:
                filter: "ansible_mounts"

            - name: "Gather package facts after removal"
              ansible.builtin.package_facts:
                manager: rpm

            # 削除後の /boot 空き容量を取得 (MB単位: /boot が単独マウントされていなければ / を参照)
            - name: "Record /boot free space after removal"
              ansible.builtin.set_fact:
                __rhel_boot_free_mb_after: >-
                  {{
                    (
                      (
                        (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/boot') | list)
                        or
                        (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | list)
                      )
                      | map(attribute='size_available')
                      | first
                      / 1024 / 1024
                    ) | round(2)
                  }}

            # 削除後の全パッケージリスト（テキスト用リスト変数作成）
            - name: "Build package full names list after removal"
              ansible.builtin.set_fact:
                __rhel_pkgs_list_after: >-
                  [
                    {% for pkg_name, pkg_list in ansible_facts['packages'] | dictsort %}
                    {% for item in pkg_list %}
                    "{{ pkg_name }}-{{ item.version }}-{{ item.release }}.{{ item.arch }}",
                    {% endfor %}
                    {% endfor %}
                  ]

            # 削除後の全パッケージリスト（エビデンスファイル出力）
            - name: "Save package list after removal"
              ansible.builtin.copy:
                content: "{{ __rhel_pkgs_list_after | join('\n') }}\n"
                dest: "{{ patch_evidence_dir }}/supports_boot_rpm_qa_after"
                mode: "0644"

            # 変数同士の差分抽出（ホスト側のファイルアクセスを一切行わないため失敗しない）
            - name: "Set fact for removed packages diff"
              ansible.builtin.set_fact:
                __rhel_removed_pkgs: >-
                  {{
                    __rhel_pkgs_list_before | difference(__rhel_pkgs_list_after)
                  }}

            - name: "Display /boot cleanup results"
              ansible.builtin.debug:
                msg:
                  - "=== /boot (または /) 空き容量変化 ==="
                  - "削除前: {{ __rhel_boot_free_mb_before }} MB"
                  - "削除後: {{ __rhel_boot_free_mb_after }} MB"
                  - "=== 削除されたパッケージ ==="
                  - "{{ __rhel_removed_pkgs }}"