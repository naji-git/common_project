---
# PATH 上の実行コマンドの有無を確認する専用モジュールがないため command を使用。
# 未導入を示す終了コード 1 は異常ではないため failed_when で除外する
- name: "Check if psql command exists after patch"
  ansible.builtin.command: "which psql"
  register: __rhel_post_check_psql
  failed_when: __rhel_post_check_psql['rc'] not in [0, 1]
  changed_when: false
 
- name: "Verify PostgreSQL related symlinks after patch"
  when: __rhel_post_check_psql['rc'] == 0
  block:
 
    # 複数シンボリックリンクのリンク先一覧を一括取得する専用モジュールがないため command を使用。
    # 一部のリンクが存在しない場合の終了コード 2 は異常ではないため failed_when で除外する
    - name: "List PostgreSQL symlinks under /bin after patch"
      ansible.builtin.command: >-
        ls -l /bin/psql /bin/clusterdb /bin/createdb /bin/createuser
        /bin/dropdb /bin/dropuser /bin/pg_basebackup /bin/pg_dump
        /bin/pg_dumpall /bin/pg_restore /bin/reindexdb /bin/vacuumdb
      register: __rhel_post_check_pg_link_bin
      failed_when: __rhel_post_check_pg_link_bin['rc'] not in [0, 2]
      changed_when: false
 
    - name: "Save PostgreSQL symlinks under /bin to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_post_check_pg_link_bin['stdout'] }}\n"
        dest: "{{ rhel_post_check_patch_evidence_dir }}/pg_link_bin_after"
        mode: "0644"
      when: __rhel_post_check_pg_link_bin['stdout'] | length > 0
 
    # 複数シンボリックリンクのリンク先一覧を一括取得する専用モジュールがないため command を使用。
    # 一部のリンクが存在しない場合の終了コード 2 は異常ではないため failed_when で除外する
    - name: "List PostgreSQL symlinks under /usr/bin after patch"
      ansible.builtin.command: >-
        ls -l /usr/bin/psql /usr/bin/clusterdb /usr/bin/createdb /usr/bin/createuser
        /usr/bin/dropdb /usr/bin/dropuser /usr/bin/pg_basebackup /usr/bin/pg_dump
        /usr/bin/pg_dumpall /usr/bin/pg_restore /usr/bin/reindexdb /usr/bin/vacuumdb
      register: __rhel_post_check_pg_link_usr
      failed_when: __rhel_post_check_pg_link_usr['rc'] not in [0, 2]
      changed_when: false
 
    - name: "Save PostgreSQL symlinks under /usr/bin to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_post_check_pg_link_usr['stdout'] }}\n"
        dest: "{{ rhel_post_check_patch_evidence_dir }}/pg_link_usr_after"
        mode: "0644"
      when: __rhel_post_check_pg_link_usr['stdout'] | length > 0
 
    - name: "Check if PostgreSQL symlinks evidence files under /bin exist"
      ansible.builtin.stat:
        path: "{{ rhel_post_check_patch_evidence_dir }}/{{ item }}"
      loop:
        - "pg_link_bin_before"
        - "pg_link_bin_after"
      register: __rhel_post_check_pg_link_bin_stats
 
    - name: "Display skip message when PostgreSQL symlinks evidence file under /bin does not exist"
      ansible.builtin.debug:
        msg: >-
          [WARNING] {{ item['item'] }} が存在しません ({{ rhel_post_check_patch_evidence_dir }}/{{ item['item'] }})。
          比較確認処理とリンク復旧処理をスキップします。ファイルの存在有無を確認してください。
      loop: "{{ __rhel_post_check_pg_link_bin_stats['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"
      when: not (item['stat']['exists'] | bool)
 
    # 事前・事後のリンク情報を unified diff 形式で比較する専用モジュールがないため command を使用。
    # 差分ありを示す終了コード 1 は異常ではないため failed_when で除外する
    - name: "Check diff between pre and post PostgreSQL symlinks"
      ansible.builtin.command:
        argv:
          - "diff"
          - "-u"
          - "{{ rhel_post_check_patch_evidence_dir }}/pg_link_bin_before"
          - "{{ rhel_post_check_patch_evidence_dir }}/pg_link_bin_after"
      register: __rhel_post_check_pg_link_diff
      when: __rhel_post_check_pg_link_bin_stats['results'] | selectattr('stat.exists', 'equalto', false) | list | length == 0
      changed_when: false
      failed_when: __rhel_post_check_pg_link_diff['rc'] not in [0, 1]
 
    - name: "Restore PostgreSQL symlinks when difference is detected"
      when: __rhel_post_check_pg_link_diff['rc'] | default(0) == 1
      vars:
        __rhel_post_check_link_backup_dir: >-
          {{ rhel_post_check_patch_evidence_dir }}/{{ ansible_facts['date_time']['date'] | replace('-', '') }}_linkrestore
        __rhel_post_check_target_links: "{{ __rhel_post_check_extracted_links['stdout'] | from_json }}"
      block:
 
        - name: "Create backup directory for modified PostgreSQL binaries"
          ansible.builtin.file:
            path: "{{ __rhel_post_check_link_backup_dir }}"
            state: directory
            mode: "0755"
 
        # 事前エビデンスからリンク定義（リンク元と参照先）を安全にパースするため shell を使用
        - name: "Extract original PostgreSQL symlink mappings from pre-check evidence"
          ansible.builtin.shell: |
            "{{ ansible_facts['python']['executable'] | default('python') }}" - << 'EOF'
            # -*- coding: utf-8 -*-
            import json
            before_file = "{{ rhel_post_check_patch_evidence_dir }}/pg_link_bin_before"
            links = []
            try:
             with open(before_file, 'r') as f:
              for line in f:
               line = line.strip()
               if "->" in line:
                parts = line.split("->")
                src_path = parts[0].strip().split()[-1]
                target_path = parts[1].strip()
                links.append({
                 'name': src_path.split('/')[-1],
                 'bin_path': src_path,
                 'target': target_path
                })
             print(json.dumps(links))
            except Exception:
             print("[]")
            EOF
          register: __rhel_post_check_extracted_links
          changed_when: false
 
        - name: "Check existence of existing binaries before moving"
          ansible.builtin.stat:
            path: "/bin/{{ item['name'] }}"
          loop: "{{ __rhel_post_check_target_links }}"
          register: __rhel_post_check_bin_stats
 
        # 既存の実体を退避ディレクトリへ移動するため command を使用
        - name: "Move modified binaries to restore backup directory"
          ansible.builtin.command:
            argv:
              - "mv"
              - "/bin/{{ item['item']['name'] }}"
              - "{{ __rhel_post_check_link_backup_dir }}/"
          become: true
          loop: "{{ __rhel_post_check_bin_stats['results'] }}"
          when: item['stat']['exists'] | bool
          changed_when: true
 
        - name: "Recreate original PostgreSQL symlinks under /bin"
          ansible.builtin.file:
            src: "{{ item['target'] }}"
            dest: "/bin/{{ item['name'] }}"
            state: link
            force: true
            follow: false
          become: true
          loop: "{{ __rhel_post_check_target_links }}"
 
    # 復旧後の /bin 配下リンク状態を再取得する専用モジュールがないため command を使用。
    # 一部のリンクが存在しない場合の終了コード 2 は異常ではないため failed_when で除外する
    - name: "List restored PostgreSQL symlinks under /bin"
      ansible.builtin.command: >-
        ls -l /bin/psql /bin/clusterdb /bin/createdb /bin/createuser
        /bin/dropdb /bin/dropuser /bin/pg_basebackup /bin/pg_dump
        /bin/pg_dumpall /bin/pg_restore /bin/reindexdb /bin/vacuumdb
      register: __rhel_post_check_pg_link_bin_restore
      failed_when: __rhel_post_check_pg_link_bin_restore['rc'] not in [0, 2]
      changed_when: false
 
    - name: "Save restored PostgreSQL symlinks under /bin to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_post_check_pg_link_bin_restore['stdout'] }}\n"
        dest: "{{ rhel_post_check_patch_evidence_dir }}/pg_link_bin_restore"
        mode: "0644"
 
    # 復旧後の /usr/bin 配下リンク状態を再取得する専用モジュールがないため command を使用。
    # 一部のリンクが存在しない場合の終了コード 2 は異常ではないため failed_when で除外する
    - name: "List restored PostgreSQL symlinks under /usr/bin"
      ansible.builtin.command: >-
        ls -l /usr/bin/psql /usr/bin/clusterdb /usr/bin/createdb /usr/bin/createuser
        /usr/bin/dropdb /usr/bin/dropuser /usr/bin/pg_basebackup /usr/bin/pg_dump
        /usr/bin/pg_dumpall /usr/bin/pg_restore /usr/bin/reindexdb /usr/bin/vacuumdb
      register: __rhel_post_check_pg_link_usr_restore
      failed_when: __rhel_post_check_pg_link_usr_restore['rc'] not in [0, 2]
      changed_when: false
 
    - name: "Save restored PostgreSQL symlinks under /usr/bin to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_post_check_pg_link_usr_restore['stdout'] }}\n"
        dest: "{{ rhel_post_check_patch_evidence_dir }}/pg_link_usr_restore"
        mode: "0644"
 
    # 日時・サイズメタデータを除外してリンク構造（パス -> リンク先）のみを抽出比較するため
    # プロセス置換を伴う shell を使用。差分ありを示す終了コード 1 は異常ではないため failed_when で除外する
    - name: "Verify /bin symlinks match pre-check evidence"
      ansible.builtin.shell: >-
        diff -u
        <(grep ' -> ' "{{ rhel_post_check_patch_evidence_dir }}/pg_link_bin_before" | awk '{for(i=9;i<=NF;i++) printf $i (i==NF?RS:OFS)}')
        <(grep ' -> ' "{{ rhel_post_check_patch_evidence_dir }}/pg_link_bin_restore" | awk '{for(i=9;i<=NF;i++) printf $i (i==NF?RS:OFS)}')
      args:
        executable: "/bin/bash"
      register: __rhel_post_check_diff_bin_final
      changed_when: false
      failed_when: __rhel_post_check_diff_bin_final['rc'] not in [0, 1]
 
    - name: "Assert /bin symlinks are completely restored"
      ansible.builtin.assert:
        that:
          - __rhel_post_check_diff_bin_final['stdout'] | trim | length == 0
        fail_msg: >-
          [ERROR] /bin 配下のシンボリックリンク復旧後に構造上の差分が残っています。
          エビデンスファイル ({{ rhel_post_check_patch_evidence_dir }}/pg_link_bin_restore) を確認し、
          手動で ln -s を再実行してください。
        success_msg: "[OK] /bin 配下のシンボリックリンクは事前状態へ正常に復旧されました。"
 
    - name: "Check if pre-check PostgreSQL symlinks evidence under /usr/bin exists"
      ansible.builtin.stat:
        path: "{{ rhel_post_check_patch_evidence_dir }}/pg_link_usr_before"
      register: __rhel_post_check_pg_link_usr_before_stat
 
    - name: "Compare PostgreSQL symlinks under /usr/bin against pre-check evidence"
      when: __rhel_post_check_pg_link_usr_before_stat['stat']['exists'] | bool
      block:
 
        # 日時・サイズメタデータを除外してリンク構造（パス -> リンク先）のみを抽出比較するため
        # プロセス置換を伴う shell を使用。差分ありを示す終了コード 1 は異常ではないため failed_when で除外する
        - name: "Verify /usr/bin symlinks match pre-check evidence"
          ansible.builtin.shell: >-
            diff -u
            <(grep ' -> ' "{{ rhel_post_check_patch_evidence_dir }}/pg_link_usr_before" | awk '{for(i=9;i<=NF;i++) printf $i (i==NF?RS:OFS)}')
            <(grep ' -> ' "{{ rhel_post_check_patch_evidence_dir }}/pg_link_usr_restore" | awk '{for(i=9;i<=NF;i++) printf $i (i==NF?RS:OFS)}')
          args:
            executable: "/bin/bash"
          register: __rhel_post_check_diff_usr_final
          changed_when: false
          failed_when: __rhel_post_check_diff_usr_final['rc'] not in [0, 1]
 
        - name: "Assert /usr/bin symlinks match pre-check evidence"
          ansible.builtin.assert:
            that:
              - __rhel_post_check_diff_usr_final['stdout'] | trim | length == 0
            fail_msg: >-
              [ERROR] /usr/bin 配下のシンボリックリンクに構造上の差分があります。
              エビデンスファイル ({{ rhel_post_check_patch_evidence_dir }}/pg_link_usr_restore) を確認し、
              手動で ln -s を再実行してください。
            success_msg: "[OK] /usr/bin 配下のシンボリックリンクは事前状態と一致しています。"
 
    - name: "Display skip message when pre-check PostgreSQL symlinks evidence under /usr/bin does not exist"
      ansible.builtin.debug:
        msg: >-
          [WARNING] pg_link_usr_before が存在しません ({{ rhel_post_check_patch_evidence_dir }}/pg_link_usr_before)。
          比較確認処理をスキップします。ファイルの存在有無を確認してください。
      when: not (__rhel_post_check_pg_link_usr_before_stat['stat']['exists'] | bool)
 
- name: "Display skip message when PostgreSQL is not installed"
  ansible.builtin.debug:
    msg: "PostgreSQL未導入のため処理をスキップします。"
  when: __rhel_post_check_psql['rc'] != 0

