---
# 1. java の実体パスを取得（java が無い場合は対象なしの判定）
# command -v によるコマンド置換と readlink -f を1回で実行するため shell を使用
- name: "Resolve real path of java executable"
  ansible.builtin.shell: >-
    readlink -f "$(command -v java)"
  register: __rhel_pre_check_ca_java_path
  changed_when: false
  failed_when: __rhel_pre_check_ca_java_path['rc'] not in [0, 1]

# 2. keytool の有無を確認（PATH 上に無い場合は対象なしの判定）
# command -v はシェル組み込みコマンドのため shell を使用
- name: "Check if keytool command exists"
  ansible.builtin.shell: >-
    command -v keytool
  register: __rhel_pre_check_ca_keytool_path
  changed_when: false
  failed_when: __rhel_pre_check_ca_keytool_path['rc'] not in [0, 1]

# 3. java と keytool が存在する場合のみ OS標準ストアと現行 cacerts の差分を確認し退避
- name: "Compare Java cacerts with OS trust store and backup extra certificates"
  when:
    - __rhel_pre_check_ca_java_path['rc'] == 0
    - __rhel_pre_check_ca_java_path['stdout'] | trim | length > 0
    - __rhel_pre_check_ca_keytool_path['rc'] == 0
  vars:
    __rhel_pre_check_ca_cacerts_path: >-
      {{ __rhel_pre_check_ca_java_path['stdout'] | trim | dirname | dirname }}/lib/security/cacerts
    __rhel_pre_check_ca_default_cacerts_path: >-
      {{ rhel_pre_check_patch_evidence_dir }}/cacerts.default
  block:

    - name: "Create evidence directory for patch operations"
      ansible.builtin.file:
        path: "{{ rhel_pre_check_patch_evidence_dir }}"
        state: directory
        mode: "0755"

    # OS標準のCA証明書ストアから Java cacerts 形式を生成する専用モジュールが無いため command を使用
    - name: "Extract OS standard CA trust store to Java cacerts format"
      ansible.builtin.command:
        argv:
          - trust
          - extract
          - --format=java-cacerts
          - --filter=ca-anchors
          - --purpose=server-auth
          - --overwrite
          - "{{ __rhel_pre_check_ca_default_cacerts_path }}"
      changed_when: true

    # keytool による証明書一覧取得には専用モジュールが無いため command を使用
    - name: "List certificates in current Java cacerts keystore"
      ansible.builtin.command:
        argv:
          - keytool
          - -list
          - -keystore
          - "{{ __rhel_pre_check_ca_cacerts_path }}"
          - -storepass
          - "{{ rhel_pre_check_ca_cert_keystore_password }}"
      register: __rhel_pre_check_ca_current_detail_out
      changed_when: false

    - name: "Save current Java cacerts certificate list to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_pre_check_ca_current_detail_out['stdout'] }}\n"
        dest: "{{ rhel_pre_check_patch_evidence_dir }}/cacerts.current.detail"
        mode: "0644"

    # keytool による証明書一覧取得には専用モジュールが無いため command を使用
    - name: "List certificates in extracted OS default cacerts keystore"
      ansible.builtin.command:
        argv:
          - keytool
          - -list
          - -keystore
          - "{{ __rhel_pre_check_ca_default_cacerts_path }}"
          - -storepass
          - "{{ rhel_pre_check_ca_cert_keystore_password }}"
      register: __rhel_pre_check_ca_default_detail_out
      changed_when: false

    - name: "Save OS default cacerts certificate list to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_pre_check_ca_default_detail_out['stdout'] }}\n"
        dest: "{{ rhel_pre_check_patch_evidence_dir }}/cacerts.default.detail"
        mode: "0644"

    - name: "Extract, sort, and compare SHA-256 fingerprints between current and default cacerts"
      vars:
        __rhel_pre_check_ca_current_sha256_lines: >-
          {{ __rhel_pre_check_ca_current_detail_out['stdout_lines'] | default([])
             | select('search', 'SHA-256') | sort | list }}
        __rhel_pre_check_ca_default_sha256_lines: >-
          {{ __rhel_pre_check_ca_default_detail_out['stdout_lines'] | default([])
             | select('search', 'SHA-256') | sort | list }}
        __rhel_pre_check_ca_diff_sha256_lines: >-
          {{ __rhel_pre_check_ca_current_sha256_lines
             | difference(__rhel_pre_check_ca_default_sha256_lines) }}
        __rhel_pre_check_ca_diff_fingerprints: >-
          {{ __rhel_pre_check_ca_diff_sha256_lines
             | map('regex_replace', '^.*SHA-256[^0-9A-Fa-f]*([0-9A-Fa-f:]+).*$', '\1')
             | list }}
        __rhel_pre_check_ca_alias_fp_pairs: >-
          {{ __rhel_pre_check_ca_current_detail_out['stdout']
             | regex_findall('(?m)^([^,\r\n]+),[^\r\n]+\r?\n[^\r\n]*SHA-256[^0-9A-Fa-f]*([0-9A-Fa-f:]+)') }}
        __rhel_pre_check_ca_diff_entries: >-
          {{ __rhel_pre_check_ca_alias_fp_pairs
             | selectattr(1, 'in', __rhel_pre_check_ca_diff_fingerprints)
             | list }}
      block:

        - name: "Save sorted SHA-256 fingerprints of current cacerts"
          ansible.builtin.copy:
            content: >-
              {{ (__rhel_pre_check_ca_current_sha256_lines | join('\n'))
                 ~ ('\n' if (__rhel_pre_check_ca_current_sha256_lines | length > 0) else '') }}
            dest: "{{ rhel_pre_check_patch_evidence_dir }}/cacerts.current.sha256"
            mode: "0644"

        - name: "Save sorted SHA-256 fingerprints of OS default cacerts"
          ansible.builtin.copy:
            content: >-
              {{ (__rhel_pre_check_ca_default_sha256_lines | join('\n'))
                 ~ ('\n' if (__rhel_pre_check_ca_default_sha256_lines | length > 0) else '') }}
            dest: "{{ rhel_pre_check_patch_evidence_dir }}/cacerts.default.sha256"
            mode: "0644"

        - name: "Display skip message when no extra ca-certificates exist in current cacerts"
          ansible.builtin.debug:
            msg: "現行 cacerts にのみ存在する ca-certificates は無いため退避処理をスキップします"
          when: __rhel_pre_check_ca_diff_entries | length == 0

        - name: "Export extra ca-certificates and save evidence"
          when: __rhel_pre_check_ca_diff_entries | length > 0
          block:

            - name: "Assert all diff fingerprints resolved to aliases"
              ansible.builtin.assert:
                that:
                  - (__rhel_pre_check_ca_diff_entries | length) == (__rhel_pre_check_ca_diff_fingerprints | length)
                fail_msg: >-
                  [ERROR] 差分フィンガープリントから証明書エイリアス名を特定できませんでした。
                  {{ rhel_pre_check_patch_evidence_dir }}/cacerts.current.detail の内容を確認してください。
                quiet: true

            # keytool -exportcert ではなく copy で冪等にファイル書き出しを行うため -rfc で PEM を取得
            - name: "Retrieve PEM content for extra ca-certificates from current cacerts"
              ansible.builtin.command:
                argv:
                  - keytool
                  - -list
                  - -rfc
                  - -alias
                  - "{{ item[0] }}"
                  - -keystore
                  - "{{ __rhel_pre_check_ca_cacerts_path }}"
                  - -storepass
                  - "{{ rhel_pre_check_ca_cert_keystore_password }}"
              loop: "{{ __rhel_pre_check_ca_diff_entries }}"
              loop_control:
                label: "{{ item[0] }}"
              register: __rhel_pre_check_ca_export_rfc_results
              changed_when: false

            - name: "Save extra ca-certificates to evidence directory"
              ansible.builtin.copy:
                content: >-
                  {{ (item['stdout']
                      | regex_search('(?s)-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----'))
                     ~ '\n' }}
                dest: "{{ rhel_pre_check_patch_evidence_dir }}/{{ item['item'][0] }}.crt"
                mode: "0644"
              loop: "{{ __rhel_pre_check_ca_export_rfc_results['results'] }}"
              loop_control:
                label: "{{ item['item'][0] }}"
              register: __rhel_pre_check_ca_copy_results

            - name: "Assert exported ca-certificates files exist"
              ansible.builtin.assert:
                that:
                  - item['dest'] is defined
                fail_msg: >-
                  [ERROR] {{ rhel_pre_check_patch_evidence_dir }}/{{ item['item']['item'][0] }}.crt が作成されていません。
                  {{ rhel_pre_check_patch_evidence_dir }} の書き込み権限を確認してください。
                success_msg: >-
                  [OK] ca-certificates を {{ rhel_pre_check_patch_evidence_dir }}/{{ item['item']['item'][0] }}.crt に退避しました（エイリアス: {{ item['item']['item'][0] }}）。
              loop: "{{ __rhel_pre_check_ca_copy_results['results'] }}"
              loop_control:
                label: "{{ item['item']['item'][0] }}"

            # rhel_post_check は別ジョブで実行されるため、退避したエイリアス名を証跡として残す
            - name: "Save target alias names to evidence file"
              ansible.builtin.copy:
                content: "{{ (__rhel_pre_check_ca_diff_entries | map('first') | join('\n')) ~ '\n' }}"
                dest: "{{ rhel_pre_check_patch_evidence_dir }}/ca-certificates_alias_before"
                mode: "0644"

            - name: "Save SHA256 fingerprints to evidence file"
              ansible.builtin.copy:
                content: "{{ (__rhel_pre_check_ca_diff_entries | map('last') | join('\n')) ~ '\n' }}"
                dest: "{{ rhel_pre_check_patch_evidence_dir }}/ca-certificates_FingerprintSHA256_before"
                mode: "0644"

- name: "Display skip message when java or keytool is not installed"
  ansible.builtin.debug:
    msg: "ca-certificatesの対象が無いので処理をスキップします"
  when: >-
    __rhel_pre_check_ca_java_path['rc'] != 0
    or (__rhel_pre_check_ca_java_path['stdout'] | trim | length == 0)
    or __rhel_pre_check_ca_keytool_path['rc'] != 0