---
# インストール済み RPM パッケージ一覧を取得する専用モジュールがないため command を使用
- name: "Get installed RPM packages after patch"
  ansible.builtin.command:
    argv:
      - "rpm"
      - "--query"
      - "--all"
  register: __rhel_post_check_rpm_qa_result
  changed_when: false
 
- name: "Save RPM package list to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_post_check_rpm_qa_result['stdout_lines'] | sort | join('\n') }}\n"
    dest: "{{ rhel_post_check_patch_evidence_dir }}/rpm_qa_after"
    mode: "0644"
 
- name: "Check if pre-check RPM package list exists"
  ansible.builtin.stat:
    path: "{{ rhel_post_check_patch_evidence_dir }}/rpm_qa_before"
  register: __rhel_post_check_rpm_qa_before_stat
 
- name: "Compare pre and post patch RPM package lists"
  when: __rhel_post_check_rpm_qa_before_stat['stat']['exists'] | bool
  vars:
    __rhel_post_check_rpm_qa_diff_lines: >-
      {{ __rhel_post_check_rpm_qa_diff['stdout_lines'] | select('match', '^[+-][^+-]') | list }}
  block:
 
    # 事前・事後の一覧ファイルを unified diff 形式で比較する専用モジュールがないため command を使用。
    # 差分ありを示す終了コード 1 は異常ではないため failed_when で除外する
    - name: "Get diff between pre and post patch RPM package lists"
      ansible.builtin.command:
        argv:
          - "diff"
          - "-u"
          - "{{ rhel_post_check_patch_evidence_dir }}/rpm_qa_before"
          - "{{ rhel_post_check_patch_evidence_dir }}/rpm_qa_after"
      register: __rhel_post_check_rpm_qa_diff
      changed_when: false
      failed_when: __rhel_post_check_rpm_qa_diff['rc'] not in [0, 1]
 
    - name: "Save RPM package diff to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_post_check_rpm_qa_diff_lines | join('\n') }}\n"
        dest: "{{ rhel_post_check_patch_evidence_dir }}/rpm_qa_diff"
        mode: "0644"
 
    - name: "Display RPM package differences"
      ansible.builtin.debug:
        msg:
          - "==================== [更新されたパッケージ] ===================="
          - "{{ '差分なし (パッケージ変更はありません)' if (__rhel_post_check_rpm_qa_diff_lines | length == 0) else __rhel_post_check_rpm_qa_diff_lines }}"
          - "================================================================"
 
- name: "Display skip message when pre-check RPM package list does not exist"
  ansible.builtin.debug:
    msg: >-
      [WARNING] rpm_qa_before が存在しません ({{ rhel_post_check_patch_evidence_dir }}/rpm_qa_before)。
      パッケージ差分の比較をスキップします。事前確認の実施有無を確認してください。
  when: not (__rhel_post_check_rpm_qa_before_stat['stat']['exists'] | bool)
 
- name: "Find backup repo files in evidence directory"
  ansible.builtin.find:
    paths: "{{ rhel_post_check_patch_evidence_dir }}"
    patterns: "*.repo_before"
  register: __rhel_post_check_backup_repo_files
 
- name: "Restore repo files from backup"
  ansible.builtin.copy:
    src: "{{ item['path'] }}"
    dest: "/etc/yum.repos.d/{{ item['path'] | basename | regex_replace('_before$', '') }}"
    remote_src: true
    mode: "0644"
  become: true
  loop: "{{ __rhel_post_check_backup_repo_files['files'] }}"
  when: __rhel_post_check_backup_repo_files['matched'] > 0

