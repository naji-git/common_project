---
# ==================================================
# 1. パッチ格納ディレクトリの削除
# ==================================================
- name: "Remove patch storage directory"
  ansible.builtin.file:
    path: "{{ rhel_post_check_rpm_directory }}"
    state: absent
 
- name: "Verify patch storage directory is removed"
  ansible.builtin.stat:
    path: "{{ rhel_post_check_rpm_directory }}"
  register: __rhel_post_check_patch_dir_stat
 
- name: "Assert patch storage directory does not exist"
  ansible.builtin.assert:
    that:
      - not __rhel_post_check_patch_dir_stat['stat']['exists']
    fail_msg: >-
      [ERROR] {{ rhel_post_check_rpm_directory }} の削除に失敗しました。ファイルが他プロセスに使用されていないか、パーミッションを確認して手動で削除してください。
    success_msg: "[OK] {{ rhel_post_check_rpm_directory }} は正常に削除されました。"
 
# ==================================================
# 2. パッチ作業ディレクトリのリネーム退避
# ==================================================
- name: "Find patch_mythos directories or files"
  ansible.builtin.find:
    paths: "{{ __rhel_post_check_work_parent_dir }}"
    patterns: "patch_mythos*"
    file_type: any
  register: __rhel_post_check_mythos_targets
 
- name: "Remove patch_mythos targets"
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    state: absent
  loop: "{{ __rhel_post_check_mythos_targets['files'] }}"
 
- name: "Check if rhel_post_check_patch_evidence_directory directory exists"
  ansible.builtin.stat:
    path: "{{ rhel_post_check_patch_evidence_directory }}"
  register: __rhel_post_check_rhel_patch_stat
 
- name: "Archive and cleanup rhel_post_check_patch_evidence_directory directory"
  vars:
    __rhel_post_check_archive_dir: "{{ __rhel_post_check_work_parent_dir }}/{{ rhel_post_check_patch_work_day }}"
  when: __rhel_post_check_rhel_patch_stat['stat']['exists'] | bool
  block:
 
    - name: "Create archive directory"
      ansible.builtin.file:
        path: "{{ __rhel_post_check_archive_dir }}"
        state: directory
        mode: "0755"
 
    # ワイルドカード展開を伴う一括移動のため shell を使用
    - name: "Move contents from rhel_post_check_patch_evidence_directory to archive directory"
      ansible.builtin.shell: >-
        mv "{{ rhel_post_check_patch_evidence_directory }}"/* "{{ __rhel_post_check_archive_dir }}/"
      changed_when: true
 
    - name: "Remove rhel_post_check_patch_evidence_directory directory"
      ansible.builtin.file:
        path: "{{ rhel_post_check_patch_evidence_directory }}"
        state: absent
 
    - name: "Verify rhel_post_check_patch_evidence_directory directory is removed"
      ansible.builtin.stat:
        path: "{{ rhel_post_check_patch_evidence_directory }}"
      register: __rhel_post_check_rhel_patch_check
 
    - name: "Assert rhel_post_check_patch_evidence_directory directory is removed"
      ansible.builtin.assert:
        that:
          - not __rhel_post_check_rhel_patch_check['stat']['exists']
        fail_msg: >-
          [ERROR] {{ rhel_post_check_patch_evidence_directory }} の削除に失敗しました。残存ファイルを確認の上、手動で退避または削除を実施してください。
        success_msg: "[OK] {{ rhel_post_check_patch_evidence_directory }} は正常に退避・削除されました。"

