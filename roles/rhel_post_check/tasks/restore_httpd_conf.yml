---
# 1. httpd.conf の存在確認（存在しない場合は作業不要の判定）
- name: "Check if httpd configuration file exists"
  ansible.builtin.stat:
    path: "/etc/httpd/conf/httpd.conf"
  register: __rhel_post_check_httpd_conf_stat

# 2. httpd.conf が存在する場合のみ後続の取得・退避・復旧処理を実行
- name: "Restore httpd configuration and verify service state"
  when: __rhel_post_check_httpd_conf_stat['stat']['exists'] | bool
  block:
    - name: "Create evidence directory for patch operations"
      ansible.builtin.file:
        path: "{{ patch_evidence_dir }}"
        state: directory
        mode: "0755"

    # --- 1. /etc/httpd/conf.modules.d 配下情報取得 ---
    # ディレクトリ配下のファイル一覧を改行区切りでそのまま保存するため shell を使用
    - name: "List files under conf.modules.d directory after patch"
      ansible.builtin.shell: >-
        ls -1 /etc/httpd/conf.modules.d
      register: __rhel_post_check_conf_modules_list
      changed_when: false

    - name: "Save conf.modules.d file list to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_post_check_conf_modules_list['stdout'] }}\n"
        dest: "{{ patch_evidence_dir }}/conf.modules.d_after"
        mode: "0644"

    # --- 2. /etc/httpd/conf.d 配下情報取得 ---
    # ディレクトリ配下のファイル一覧を改行区切りでそのまま保存するため shell を使用
    - name: "List files under conf.d directory after patch"
      ansible.builtin.shell: >-
        ls -1 /etc/httpd/conf.d
      register: __rhel_post_check_conf_d_list
      changed_when: false

    - name: "Save conf.d file list to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_post_check_conf_d_list['stdout'] }}\n"
        dest: "{{ patch_evidence_dir }}/conf.d_after"
        mode: "0644"

    # --- 3. httpd.service 退避 ---
    - name: "Check if httpd systemd service file exists"
      ansible.builtin.stat:
        path: "/usr/lib/systemd/system/httpd.service"
      register: __rhel_post_check_httpd_service_stat

    - name: "Backup post-patch httpd systemd service file"
      ansible.builtin.copy:
        src: "/usr/lib/systemd/system/httpd.service"
        dest: "{{ patch_evidence_dir }}/httpd.service_after"
        remote_src: true
        mode: preserve
      when: __rhel_post_check_httpd_service_stat['stat']['exists'] | bool

    # ==================================================
    # 差分比較・余剰ファイル移動・設定およびサービス復旧
    # ==================================================

    # --- 4. conf.modules.d 比較と余剰ファイル退避 ---
    # 事前・事後一覧の差分から新規追加分のみを抽出するため diff, grep, sed を組み合わせた shell を使用
    - name: "Detect added configuration files in conf.modules.d"
      ansible.builtin.shell: >-
        diff -u "{{ patch_evidence_dir }}/conf.modules.d_before" "{{ patch_evidence_dir }}/conf.modules.d_after" | grep -E '^\+[^+]' | sed 's/^+//' || true
      register: __rhel_post_check_added_modules_files
      changed_when: false

    # 差分として検知された余剰ファイルを退避ディレクトリに移動するため command を使用
    - name: "Move added files in conf.modules.d to evidence directory"
      ansible.builtin.command: "mv /etc/httpd/conf.modules.d/{{ item }} {{ patch_evidence_dir }}/"
      loop: "{{ __rhel_post_check_added_modules_files['stdout_lines'] }}"
      when: __rhel_post_check_added_modules_files['stdout_lines'] | length > 0

    # 余剰ファイル移動後のディレクトリ状態を再取得・保存するためリダイレクトを含む shell を使用
    - name: "Rescan files in conf.modules.d after cleanup"
      ansible.builtin.shell: "ls -1 /etc/httpd/conf.modules.d > \"{{ patch_evidence_dir }}/conf.modules.d_after_mv\""
      changed_when: false

    # 移動後状態と事前エビデンスの差分を取得するため shell を使用
    - name: "Check diff of conf.modules.d against pre-patch state"
      ansible.builtin.shell: >-
        diff -u "{{ patch_evidence_dir }}/conf.modules.d_before" "{{ patch_evidence_dir }}/conf.modules.d_after_mv" || true
      register: __rhel_post_check_diff_modules_final
      changed_when: false

    - name: "Assert conf.modules.d matches pre-patch state"
      ansible.builtin.assert:
        that:
          - __rhel_post_check_diff_modules_final['stdout'] | trim | length == 0
        fail_msg: >-
          [ERROR] conf.modules.d がパッチ適用前の構成と一致していません。手動で /etc/httpd/conf.modules.d のファイル構成を確認してください。
          差分内容:
          {{ __rhel_post_check_diff_modules_final['stdout'] }}
        success_msg: "[OK] conf.modules.d はパッチ適用前の構成と一致しています。"

    # --- 5. conf.d 比較と余剰ファイル退避 ---
    # 事前・事後一覧の差分から新規追加分のみを抽出するため diff, grep, sed を組み合わせた shell を使用
    - name: "Detect added configuration files in conf.d"
      ansible.builtin.shell: >-
        diff -u "{{ patch_evidence_dir }}/conf.d_before" "{{ patch_evidence_dir }}/conf.d_after" | grep -E '^\+[^+]' | sed 's/^+//' || true
      register: __rhel_post_check_added_confd_files
      changed_when: false

    # 差分として検知された余剰ファイルを退避ディレクトリに移動するため command を使用
    - name: "Move added files in conf.d to evidence directory"
      ansible.builtin.command: "mv /etc/httpd/conf.d/{{ item }} {{ patch_evidence_dir }}/"
      loop: "{{ __rhel_post_check_added_confd_files['stdout_lines'] }}"
      when: __rhel_post_check_added_confd_files['stdout_lines'] | length > 0

    # 余剰ファイル移動後のディレクトリ状態を再取得・保存するためリダイレクトを含む shell を使用
    - name: "Rescan files in conf.d after cleanup"
      ansible.builtin.shell: "ls -1 /etc/httpd/conf.d > \"{{ patch_evidence_dir }}/conf.d_after_mv\""
      changed_when: false

    # 移動後状態と事前エビデンスの差分を取得するため shell を使用
    - name: "Check diff of conf.d against pre-patch state"
      ansible.builtin.shell: >-
        diff -u "{{ patch_evidence_dir }}/conf.d_before" "{{ patch_evidence_dir }}/conf.d_after_mv" || true
      register: __rhel_post_check_diff_confd_final
      changed_when: false

    - name: "Assert conf.d matches pre-patch state"
      ansible.builtin.assert:
        that:
          - __rhel_post_check_diff_confd_final['stdout'] | trim | length == 0
        fail_msg: >-
          [ERROR] conf.d がパッチ適用前の構成と一致していません。手動で /etc/httpd/conf.d のファイル構成を確認してください。
          差分内容:
          {{ __rhel_post_check_diff_confd_final['stdout'] }}
        success_msg: "[OK] conf.d はパッチ適用前の構成と一致しています。"

    # --- 6. httpd.service の復旧 ---
    - name: "Restore pre-patch httpd systemd service file"
      ansible.builtin.copy:
        src: "{{ patch_evidence_dir }}/httpd.service_before"
        dest: "/usr/lib/systemd/system/httpd.service"
        remote_src: true
        mode: "0644"

    # --- 7. Apache サービス再読み込みと起動確認 ---
    - name: "Reload systemd daemon configuration"
      ansible.builtin.systemd:
        daemon_reload: true

    # 起動直前のステータス詳細（ログ出力）を取得するため command を使用
    - name: "Check httpd service status before starting"
      ansible.builtin.command: "systemctl status httpd.service"
      register: __rhel_post_check_httpd_status_before_start
      failed_when: false
      changed_when: false

    - name: "Ensure httpd service is started"
      ansible.builtin.systemd:
        name: httpd
        state: started

    # 起動直後のステータス詳細（アクティブ状態確認）を取得するため command を使用
    - name: "Verify httpd service is active after start"
      ansible.builtin.command: "systemctl status httpd.service"
      register: __rhel_post_check_httpd_status_after_start
      changed_when: false

# 3. httpd 未導入時のログ表示
- name: "Display skip message when httpd is not installed"
  ansible.builtin.debug:
    msg: "httpd is not installed (/etc/httpd/conf/httpd.conf not found). Skipping httpd restore tasks."
  when: not (__rhel_post_check_httpd_conf_stat['stat']['exists'] | bool)