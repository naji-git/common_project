---
- name: "Create evidence directory for post-check"
  ansible.builtin.file:
    path: "{{ rhel_post_check_patch_evidence_dir }}"
    state: directory
    mode: "0755"
 
# 過去ログを含めた sar 全体出力をエビデンス化するため command を使用
- name: "Get sar CPU usage logs after patch"
  ansible.builtin.command: "sar -u"
  register: __rhel_post_check_cpu_usage
  changed_when: false
 
- name: "Save CPU usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_post_check_cpu_usage['stdout'] }}\n"
    dest: "{{ rhel_post_check_patch_evidence_dir }}/cpu_usage_after"
    mode: "0644"
 
# 当日の sar メモリログ全体をエビデンス化（CPUの sar -u と粒度を統一）するため command を使用
- name: "Get sar memory usage logs after patch"
  ansible.builtin.command: "sar -r"
  register: __rhel_post_check_mem_usage
  changed_when: false
 
- name: "Save memory usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_post_check_mem_usage['stdout'] }}\n"
    dest: "{{ rhel_post_check_patch_evidence_dir }}/mem_usage_after"
    mode: "0644"
 
# システム全体のディスク構成・使用状況をエビデンス化するため command を使用
- name: "Get entire disk usage logs after patch"
  ansible.builtin.command: "df -h"
  register: __rhel_post_check_disk_usage
  changed_when: false
 
- name: "Save disk usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_post_check_disk_usage['stdout'] }}\n"
    dest: "{{ rhel_post_check_patch_evidence_dir }}/disk_usage_after"
    mode: "0644"
 
- name: "Check if pre-check resource usage files exist"
  ansible.builtin.stat:
    path: "{{ rhel_post_check_patch_evidence_dir }}/{{ item }}"
  loop:
    - "cpu_usage_before"
    - "mem_usage_before"
    - "disk_usage_before"
  register: __rhel_post_check_usage_before_stats
 
- name: "Display warning when pre-check resource usage file does not exist"
  ansible.builtin.debug:
    msg: >-
      [WARNING] {{ item['item'] }} が存在しません ({{ rhel_post_check_patch_evidence_dir }}/{{ item['item'] }})。
      {{ item['item'] }} に対応するリソース比較確認をスキップします。事前確認の実施有無を確認してください。
  loop: "{{ __rhel_post_check_usage_before_stats['results'] }}"
  loop_control:
    label: "{{ item['item'] }}"
  when: not (item['stat']['exists'] | bool)
 
- name: "Compare resource usage with pre-patch status"
  when: __rhel_post_check_usage_before_stats['results'] | selectattr('stat.exists', 'equalto', true) | list | length > 0
  block:
 
    # 既存エビデンスファイルの解析・数値パースおよび差分計算をPythonで一括処理するため shell を使用
    - name: "Analyze resource usage comparison with pre-patch status"
      ansible.builtin.shell: |
        "{{ ansible_facts['python']['executable'] | default('python') }}" - << 'EOF'
        # -*- coding: utf-8 -*-
        import os
        import datetime
 
        evidence_dir = "{{ rhel_post_check_patch_evidence_dir }}"
 
        def get_file_mtime_str(path):
         if os.path.exists(path):
          ts = os.path.getmtime(path)
          return datetime.datetime.fromtimestamp(ts).strftime("%H:%M:%S")
         return "N/A"
 
        # --- 1. CPU使用率 (sar -u の末尾データ行: %idle 列から算出) ---
        def get_sar_cpu(filepath):
         val = None
         idle_idx = -1
         if not os.path.exists(filepath):
          return None
         with open(filepath, 'r') as f:
          for line in f:
           parts = line.strip().split()
           if not parts or parts[0] == "Linux":
            continue
           if "%idle" in parts:
            idle_idx = parts.index("%idle")
            continue
           if idle_idx != -1 and len(parts) > idle_idx and parts[0] != "Average:":
            try:
             val = 100.0 - float(parts[idle_idx])
            except ValueError:
             pass
         return val
 
        cpu_before_file = os.path.join(evidence_dir, "cpu_usage_before")
        cpu_after_file = os.path.join(evidence_dir, "cpu_usage_after")
        cpu_before_val = get_sar_cpu(cpu_before_file)
        cpu_after_val = get_sar_cpu(cpu_after_file)
 
        # --- 2. メモリ使用率 (sar -r の末尾データ行: %memused 列から取得) ---
        def get_sar_mem(filepath):
         val = None
         memused_idx = -1
         if not os.path.exists(filepath):
          return None
         with open(filepath, 'r') as f:
          for line in f:
           parts = line.strip().split()
           if not parts or parts[0] == "Linux":
            continue
           if "%memused" in parts:
            memused_idx = parts.index("%memused")
            continue
           if memused_idx != -1 and len(parts) > memused_idx and parts[0] != "Average:":
            try:
             val = float(parts[memused_idx])
            except ValueError:
             pass
         return val
 
        mem_before_file = os.path.join(evidence_dir, "mem_usage_before")
        mem_after_file = os.path.join(evidence_dir, "mem_usage_after")
        mem_before_val = get_sar_mem(mem_before_file)
        mem_after_val = get_sar_mem(mem_after_file)
 
        # --- 3. ディスク(/)使用率 (df -h のマウントポイント / 行から取得) ---
        def get_disk_root(filepath):
         val = None
         if not os.path.exists(filepath):
          return None
         with open(filepath, 'r') as f:
          for line in f:
           parts = line.strip().split()
           if len(parts) >= 6 and parts[5] == "/":
            try:
             val = float(parts[4].replace("%", ""))
            except ValueError:
             pass
         return val
 
        disk_before_file = os.path.join(evidence_dir, "disk_usage_before")
        disk_after_file = os.path.join(evidence_dir, "disk_usage_after")
        disk_before_val = get_disk_root(disk_before_file)
        disk_after_val = get_disk_root(disk_after_file)
 
        now_time = datetime.datetime.now().strftime("%H:%M:%S")
 
        def format_diff(before, after):
         if before is None or after is None:
          return "データ取得不可 (パッチ適用前: {0}, パッチ適用後: {1})".format(before, after)
         diff = after - before
         sign = "+" if diff > 0 else ""
         return "パッチ適用前: {0:.1f}% -> パッチ適用後: {1:.1f}% (増減: {2}{3:.1f}%)".format(before, after, sign, diff)
 
        if os.path.exists(cpu_before_file):
         print("=== CPU使用率 ===")
         print(format_diff(cpu_before_val, cpu_after_val))
 
        if os.path.exists(mem_before_file):
         print("=== メモリ使用率 ===")
         print(format_diff(mem_before_val, mem_after_val))
 
        if os.path.exists(disk_before_file):
         print("=== ディスク(/)使用率 ===")
         print(format_diff(disk_before_val, disk_after_val))
        EOF
      register: __rhel_post_check_comparison_result
      changed_when: false
 
    - name: "Display resource usage comparison"
      ansible.builtin.debug:
        msg: "{{ __rhel_post_check_comparison_result['stdout_lines'] }}"

