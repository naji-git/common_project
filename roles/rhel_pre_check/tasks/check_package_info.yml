---
# --------------------------------------------------
# 0. OSメジャーバージョンに応じた対象設定ファイルの決定
# --------------------------------------------------
- name: "Determine package manager configuration file path"
  ansible.builtin.set_fact:
    __rhel_pre_check_target_pkg_conf: "{{ '/etc/yum.conf' if (ansible_facts['distribution_major_version'] | string == '7') else '/etc/dnf/dnf.conf' }}"

# --------------------------------------------------
# 1. yum.conf / dnf.conf 確認
# --------------------------------------------------
# 設定ファイルの内容全体をバイナリ安全に読み込むため slurp モジュールを使用
- name: "Read package manager configuration file"
  ansible.builtin.slurp:
    src: "{{ __rhel_pre_check_target_pkg_conf }}"
  register: __rhel_pre_check_pkg_conf_slurp

- name: "Save package manager configuration to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_pre_check_pkg_conf_slurp.content | b64decode }}"
    dest: "{{ patch_evidence_dir }}/{{ __rhel_pre_check_target_pkg_conf | basename }}_before"
    mode: "0644"

# --------------------------------------------------
# 2. yum.conf / dnf.conf 修正
# ※ 有効な exclude 行が存在する場合のみ実行
# --------------------------------------------------
- name: "Check if active exclude directive exists"
  ansible.builtin.lineinfile:
    path: "{{ __rhel_pre_check_target_pkg_conf }}"
    regexp: '^\s*exclude\s*=.*kernel.*'
    state: absent
  check_mode: true
  register: __rhel_pre_check_check_exclude
  changed_when: false

- name: "Modify package manager configuration when exclude is present"
  when:
    - __rhel_pre_check_check_exclude.found is defined
    - __rhel_pre_check_check_exclude.found > 0
  block:
    - name: "Backup original package manager configuration file"
      ansible.builtin.copy:
        src: "{{ __rhel_pre_check_target_pkg_conf }}"
        dest: "{{ __rhel_pre_check_target_pkg_conf }}_{{ ansible_facts['date_time']['date'] | replace('-', '') }}"
        remote_src: true
        mode: preserve

    - name: "Update installonly_limit value to 2"
      ansible.builtin.lineinfile:
        path: "{{ __rhel_pre_check_target_pkg_conf }}"
        regexp: '^\s*installonly_limit\s*='
        line: "installonly_limit=2"
        state: present

    - name: "Comment out exclude directive in configuration file"
      ansible.builtin.replace:
        path: "{{ __rhel_pre_check_target_pkg_conf }}"
        regexp: '^(\s*exclude\s*=.*kernel.*)'
        replace: '#\1'

# --------------------------------------------------
# 3. パッケージ一覧取得 (rpm -qa | sort -n)
# --------------------------------------------------
# RPMパッケージ一覧をバージョン順にソートして一括抽出するためパイプを伴う shell を使用
- name: "Retrieve sorted list of installed RPM packages"
  ansible.builtin.shell: >-
    rpm -qa | sort -n
  register: __rhel_pre_check_rpm_qa_result
  changed_when: false

- name: "Save RPM package list to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_pre_check_rpm_qa_result.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/rpm_qa_before"
    mode: "0644"