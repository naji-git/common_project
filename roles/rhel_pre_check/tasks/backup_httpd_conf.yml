---
# 1. httpd利用有無(httpd_in_use)の確認（利用しない場合は作業不要の判定）
- name: "Assert httpd_in_use is true or false"
  ansible.builtin.assert:
    that:
      - rhel_pre_check_httpd_in_use | string | lower in ['true', 'false']
    fail_msg: >-
      [ERROR] httpd_in_use に true / false 以外の値が指定されています（指定値: "{{ rhel_pre_check_httpd_in_use }}"）。
      inventory の group_vars の httpd_in_use を true または false で指定してください。
    success_msg: "httpd_in_use: {{ rhel_pre_check_httpd_in_use | string | lower }}（true の場合のみ httpd 設定の退避を実行します）"
 
# 2. httpd を利用する場合のみ後続の取得・退避処理を実行
- name: "Backup and collect httpd configuration evidence"
  when: rhel_pre_check_httpd_in_use | bool
  block:
 
    - name: "Create evidence directory for patch operations"
      ansible.builtin.file:
        path: "{{ rhel_pre_check_patch_evidence_directory }}"
        state: directory
        mode: "0755"
 
    # --- 1. /etc/httpd/conf.modules.d 配下情報取得 ---
    # ディレクトリ配下のファイル名一覧を改行区切りでそのまま保存するため shell を使用
    - name: "List files under conf.modules.d directory"
      ansible.builtin.shell: >-
        ls -1 /etc/httpd/conf.modules.d
      register: __rhel_pre_check_conf_modules_list
      changed_when: false
 
    - name: "Save conf.modules.d file list to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_pre_check_conf_modules_list['stdout'] }}\n"
        dest: "{{ rhel_pre_check_patch_evidence_directory }}/conf.modules.d_before"
        mode: "0644"
 
    # --- 2. /etc/httpd/conf.d 配下情報取得 ---
    # ディレクトリ配下のファイル名一覧を改行区切りでそのまま保存するため shell を使用
    - name: "List files under conf.d directory"
      ansible.builtin.shell: >-
        ls -1 /etc/httpd/conf.d
      register: __rhel_pre_check_conf_d_list
      changed_when: false
 
    - name: "Save conf.d file list to evidence file"
      ansible.builtin.copy:
        content: "{{ __rhel_pre_check_conf_d_list['stdout'] }}\n"
        dest: "{{ rhel_pre_check_patch_evidence_directory }}/conf.d_before"
        mode: "0644"
 
    # --- 3. httpd.service 退避 ---
    - name: "Check if httpd systemd service file exists"
      ansible.builtin.stat:
        path: "/usr/lib/systemd/system/httpd.service"
      register: __rhel_pre_check_httpd_service_stat
 
    - name: "Backup original httpd systemd service file"
      ansible.builtin.copy:
        src: "/usr/lib/systemd/system/httpd.service"
        dest: "{{ rhel_pre_check_patch_evidence_directory }}/httpd.service_before"
        remote_src: true
        mode: preserve
      when: __rhel_pre_check_httpd_service_stat['stat']['exists'] | bool
 
# 3. httpd 未利用の場合は処理をスキップする
- name: "Display skip message when httpd is not in use"
  ansible.builtin.debug:
    msg: "httpdを利用していないため処理をスキップします。"
  when: not (rhel_pre_check_httpd_in_use | bool)

