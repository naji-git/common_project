- name: プロセス状態確認
  command: /usr/local/sam/kanshi/shell/sk_proc_dsp.sh
  register: process_status
  changed_when: false

- name: プロセス状態確認結果保存
  copy:
    content: "{{ process_status.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/process_status_after"
    mode: '0644'

- name: カーネルバージョン確認
  command: uname -r
  register: kernel_version
  changed_when: false

- name: カーネルバージョン結果保存
  copy:
    content: "{{ kernel_version.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/kernel_version_after"
    mode: '0644'

- name: サービス自動起動設定確認
  shell: >
    systemctl list-unit-files | grep -Ev '\.(scope|slice)'
  register: unit_files
  changed_when: false

- name: サービス自動起動設定結果保存
  copy:
    content: "{{ unit_files.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/unit-files_after"
    mode: '0644'

- name: Javaディレクトリ存在確認
  ansible.builtin.stat:
    path: /usr/lib/jvm
  register: jvm_dir

- name: Java関連ファイル確認・保存ブロック
  when: jvm_dir.stat.exists
  block:
    - name: Java関連ファイル確認
      ansible.builtin.command: ls -l /usr/lib/jvm
      register: java_info
      changed_when: false

    - name: Java関連ファイル結果保存
      ansible.builtin.copy:
        content: "{{ java_info.stdout }}\n"
        dest: "{{ patch_evidence_dir }}/java_info_after"
        mode: '0644'

# ==================================================
# 作業前後での比較処理
# ==================================================

# --------------------------------------------------
# 1. Java 情報の比較・表示
# --------------------------------------------------
- name: 事前Java情報の読み込み確認
  ansible.builtin.stat:
    path: "{{ patch_evidence_dir }}/java_info_before"
  register: java_before_stat

- name: 事前Java情報の取得
  ansible.builtin.slurp:
    src: "{{ patch_evidence_dir }}/java_info_before"
  register: java_info_before_b64
  when: java_before_stat.stat.exists

- name: 作業前後のJavaバージョン文字列を抽出
  ansible.builtin.set_fact:
    # ls -l の結果から 'java-数字' で始まる実体パッケージディレクトリ名を抽出
    java_ver_before: >-
      {{ (java_info_before_b64.content | b64decode).split('\n')
         | select('match', '.*java-[0-9].*openjdk-[0-9].*')
         | map('regex_replace', '^.*\\s(java-.*)$', '\\1')
         | list | first | default('事前ファイルなし または 未特定') }}
    java_ver_after: >-
      {{ (java_info.stdout | default('')).split('\n')
         | select('match', '.*java-[0-9].*openjdk-[0-9].*')
         | map('regex_replace', '^.*\\s(java-.*)$', '\\1')
         | list | default(['Java未検出']) | first }}

- name: Java バージョン比較結果表示
  ansible.builtin.debug:
    msg:
      - "=== Java バージョン比較 ==="
      - "作業前: {{ java_ver_before }}"
      - "作業後: {{ java_ver_after }}"
      - "変更有無: {{ '変更あり (バージョンアップ検知)' if (java_ver_before != java_ver_after and java_ver_before != '事前ファイルなし または 未特定') else '変更なし' }}"

# --------------------------------------------------
# 2. カーネルバージョンの比較・表示
# --------------------------------------------------
- name: 事前カーネルバージョンの読み込み
  ansible.builtin.slurp:
    src: "{{ patch_evidence_dir }}/kernel_version_before"
  register: kernel_before_b64
  ignore_errors: true

- name: カーネルバージョン比較結果表示
  ansible.builtin.debug:
    msg:
      - "=== Kernel Version 比較 ==="
      - "作業前: {{ (kernel_before_b64.content | b64decode | trim) if (kernel_before_b64 is succeeded) else '取得失敗またはファイルなし' }}"
      - "作業後: {{ kernel_version.stdout | trim }}"
      - "変更有無: {{ '変更あり (アップデート・再起動検知)' if (kernel_before_b64 is succeeded and (kernel_before_b64.content | b64decode | trim) != (kernel_version.stdout | trim)) else '変更なし' }}"

# --------------------------------------------------
# 3. サービス自動起動設定（unit-files）の差分抽出・表示
# --------------------------------------------------
- name: サービス自動起動設定の差分確認 (diff -u)
  ansible.builtin.command: >
    diff -u {{ patch_evidence_dir }}/unit-files_before {{ patch_evidence_dir }}/unit-files_after
  register: unit_files_diff
  failed_when: false
  changed_when: false

- name: サービス自動起動設定 差分結果表示
  ansible.builtin.debug:
    msg: "{{ unit_files_diff.stdout_lines if unit_files_diff.rc != 0 else ['差分なし（作業前後で自動起動設定に変更はありません）'] }}"