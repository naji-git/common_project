---
# --------------------------------------------------
# 0.事後確認エビデンスディレクトリの準備
# --------------------------------------------------
- name: "Create evidence directory for post-check"
  ansible.builtin.file:
    path: "{{ patch_evidence_dir }}"
    state: directory
    mode: "0755"

# ==================================================
# 事後リソース使用状況の確認
# ==================================================

# --------------------------------------------------
# 1. CPU使用率確認 & 閾値チェック
# --------------------------------------------------
# 過去ログを含めた sar 全体出力をエビデンス化
- name: "Get sar CPU usage logs after patch"
  ansible.builtin.command: sar -u
  register: __rhel_post_check_cpu_usage
  changed_when: false

- name: "Save CPU usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_post_check_cpu_usage.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/cpu_usage_after"
    mode: "0644"

# --------------------------------------------------
# 2. メモリ使用率確認 & 閾値チェック
# --------------------------------------------------
# 当日の sar メモリログ全体をエビデンス化（CPUの sar -u と粒度を統一）
- name: "Get sar memory usage logs after patch"
  ansible.builtin.command: sar -r
  register: __rhel_post_check_mem_usage
  changed_when: false

- name: "Save memory usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_post_check_mem_usage.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/mem_usage_after"
    mode: "0644"

# --------------------------------------------------
# 3. ディスク使用率確認 & 閾値チェック (/ 使用率)
# --------------------------------------------------
# システム全体のディスク構成・使用状況をエビデンス化
- name: "Get entire disk usage logs after patch"
  ansible.builtin.command: df -h
  register: __rhel_post_check_disk_usage
  changed_when: false

- name: "Save disk usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_post_check_disk_usage.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/disk_usage_after"
    mode: "0644"

