# --------------------------------------------------
# 0.事前確認エビデンスディレクトリの準備（既存退避 & 新規作成）
# --------------------------------------------------
- name: "Check if evidence directory already exists"
  ansible.builtin.stat:
    path: "{{ patch_evidence_dir }}"
  register: __rhel_pre_check_existing_evidence_dir

- name: "Backup and rename existing evidence directory"
  when: __rhel_pre_check_existing_evidence_dir.stat.exists | bool
  block:
    - name: "Rename existing evidence directory with timestamp"
      ansible.builtin.command: >-
        mv {{ patch_evidence_dir }} {{ patch_evidence_dir }}_backup_{{ ansible_facts['date_time']['iso8601_basic_short'] }}
      register: __rhel_pre_check_backup_result
      changed_when: true

    - name: "Display message for renamed evidence directory"
      ansible.builtin.debug:
        msg: "[NOTICE] 前回の作業ディレクトリが残っていたため、バックアップとしてリネーム退避しました: {{ patch_evidence_dir }}_backup_{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

- name: "Create fresh evidence directory for pre-check"
  ansible.builtin.file:
    path: "{{ patch_evidence_dir }}"
    state: directory
    mode: "0755"

# ==================================================
# 事前リソース使用状況の確認
# ==================================================

# --------------------------------------------------
# 1. CPU使用率確認 & 閾値チェック
# --------------------------------------------------
- name: "Check current CPU usage before patch"
  ansible.builtin.shell: >-
    LANG=C sar -u 1 3 | awk '/Average:/ {printf "%.0f", 100 - $NF}'
  register: __rhel_pre_check_current_cpu_usage
  changed_when: false

- name: "Get sar CPU usage logs before patch"
  ansible.builtin.command: sar -u
  register: __rhel_pre_check_cpu_usage
  changed_when: false

- name: "Save CPU usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_pre_check_cpu_usage.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/cpu_usage_before"
    mode: "0644"

# --------------------------------------------------
# 2. メモリ使用率確認 & 閾値チェック
# --------------------------------------------------
# 突発的なスパイクを排除するため 1秒×3回サンプリングの平均値 (Average) から現行メモリ使用率を算出
- name: "Check current memory usage before patch"
  ansible.builtin.shell: >-
    LANG=C sar -r 1 3 | awk '/Average:/ {printf "%.0f", $5}'
  register: __rhel_pre_check_current_mem_usage
  changed_when: false

# 当日の sar メモリログ全体をエビデンス化（CPUの sar -u と粒度を統一）
- name: "Get sar memory usage logs before patch"
  ansible.builtin.command: sar -r
  register: __rhel_pre_check_mem_usage
  changed_when: false

- name: "Save memory usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_pre_check_mem_usage.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/mem_usage_before"
    mode: "0644"

# --------------------------------------------------
# 3. ディスク使用率確認
# --------------------------------------------------
- name: "Check current root filesystem disk usage before patch"
  ansible.builtin.shell: >-
    df -h / | awk 'NR==2 {gsub("%",""); print $5}'
  register: __rhel_pre_check_current_disk_usage
  changed_when: false

- name: "Get disk usage logs before patch"
  ansible.builtin.command: df -h
  register: __rhel_pre_check_disk_usage
  changed_when: false

- name: "Save disk usage logs to evidence file"
  ansible.builtin.copy:
    content: "{{ __rhel_pre_check_disk_usage.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/disk_usage_before"
    mode: "0644"

# --------------------------------------------------
# 4. 取得したリソース情報のサマリ表示
# --------------------------------------------------
- name: "Display gathered resource usage"
  ansible.builtin.debug:
    msg:
      - "=== 事前リソース確認結果 ==="
      - "CPU使用率   : {{ __rhel_pre_check_current_cpu_usage.stdout }}% (閾値: {{ rhel_pre_check_threshold_cpu_usage | default(95) }}%)"
      - "メモリ使用率 : {{ __rhel_pre_check_current_mem_usage.stdout }}% (閾値: {{ rhel_pre_check_threshold_mem_usage | default(95) }}%)"
      - "ディスク使用率: {{ __rhel_pre_check_current_disk_usage.stdout }}% (閾値: {{ rhel_pre_check_threshold_disk_usage | default(90) }}%)"

- name: "Verify resource usage is within thresholds before patch"
  ansible.builtin.assert:
    that:
      - (__rhel_pre_check_current_cpu_usage.stdout | trim | float) <= (rhel_pre_check_threshold_cpu_usage | default(95) | float)
      - (__rhel_pre_check_current_mem_usage.stdout | trim | float) <= (rhel_pre_check_threshold_mem_usage | default(95) | float)
      - (__rhel_pre_check_current_disk_usage.stdout | trim | float) <= (rhel_pre_check_threshold_disk_usage | default(90) | float)
    fail_msg: >-
      事後リソース使用率が許容閾値を超過しています。パッチ適用後のプロセス状態やリソース状況を確認してください。
      (CPU: {{ __rhel_pre_check_current_cpu_usage.stdout | trim }}%/閾値: {{ rhel_pre_check_threshold_cpu_usage | default(95) }}%,
      MEM: {{ __rhel_pre_check_current_mem_usage.stdout | trim }}%/閾値: {{ rhel_pre_check_threshold_mem_usage | default(95) }}%,
      DISK: {{ __rhel_pre_check_current_disk_usage.stdout | trim }}%/閾値: {{ rhel_pre_check_threshold_disk_usage | default(90) }}%)
    success_msg: "すべての事後リソース使用率が正常範囲内です。"

# ==================================================
# 5. RHEL 7 専用: /boot 容量確保 (kernel-debug 削除)
# 対象: RHEL 7 かつ ホスト名が "SV" から始まる仮想基盤のサーバ
# ==================================================
- name: "Ensure boot partition space on RHEL 7 (SV hosts only)"
  when:
    - ansible_facts['distribution_major_version'] == "7"
    - ansible_facts['hostname'] is match('^SV.*')
  block:
    # 稼働中カーネルの名称を取得するため command を使用
    - name: "Check running kernel release"
      ansible.builtin.command: uname -r
      register: __rhel_pre_check_current_kernel
      changed_when: false

    - name: "Assert running kernel is not a debug kernel"
      ansible.builtin.assert:
        that:
          - "'debug' not in __rhel_pre_check_current_kernel.stdout"
        fail_msg: "現在 kernel-debug で起動しているため削除できません。通常カーネルで再起動後に再実行してください。"

    # パッケージの存在を正規表現で検出するため shell を使用
    - name: "Detect installed kernel-debug packages"
      ansible.builtin.shell: >-
        rpm -qa | grep -E '^kernel-debug-[0-9]' || true
      register: __rhel_pre_check_installed_kernel_debug
      changed_when: false

    - name: "Remove kernel-debug packages if installed"
      when:
        - __rhel_pre_check_installed_kernel_debug.stdout | trim | length > 0
      block:
        # 削除前の /boot 領域サイズを確認するため shell を使用
        - name: "Check /boot disk space before removal"
          ansible.builtin.shell: df -h /boot
          register: __rhel_pre_check_df_boot_before
          changed_when: false

        # 削除前の RPM 一覧を退避するため shell を使用
        - name: "Save RPM package list before removal"
          ansible.builtin.shell: >-
            rpm -qa | sort -n > {{ patch_evidence_dir }}/rpm_qa_before
          changed_when: false

        # 専用モジュール ansible.builtin.yum を使用して冪等性を確保
        - name: "Remove installed kernel-debug packages"
          ansible.builtin.yum:
            name: "{{ __rhel_pre_check_installed_kernel_debug.stdout_lines }}"
            state: absent

        # 削除後の /boot 領域サイズを確認するため shell を使用
        - name: "Check /boot disk space after removal"
          ansible.builtin.shell: df -h /boot
          register: __rhel_pre_check_df_boot_after
          changed_when: false

        # 削除後の差分確認と一覧退避のため shell を使用
        - name: "Save RPM package list after removal and generate diff"
          ansible.builtin.shell: >-
            rpm -qa | sort -n > {{ patch_evidence_dir }}/rpm_qa_after
            diff -u {{ patch_evidence_dir }}/rpm_qa_before {{ patch_evidence_dir }}/rpm_qa_after || true
          register: __rhel_pre_check_rpm_diff
          changed_when: false

        - name: "Display /boot cleanup results"
          ansible.builtin.debug:
            msg:
              - "=== /boot 容量変化 ==="
              - "削除前: {{ __rhel_pre_check_df_boot_before.stdout_lines[1] }}"
              - "削除後: {{ __rhel_pre_check_df_boot_after.stdout_lines[1] }}"
              - "=== 削除された RPM パッケージ ==="
              - "{{ __rhel_pre_check_rpm_diff.stdout_lines }}"
