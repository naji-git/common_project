---
# ==================================================
# 1. SAM監視ログ確認
# ==================================================
- name: "Set today date formatted variable"
  ansible.builtin.set_fact:
    __rhel_post_check_today_compact: "{{ ansible_facts['date_time']['date'] | replace('-', '') }}"
    __rhel_post_check_today_hyphen: "{{ ansible_facts['date_time']['date'] }}"
 
- name: "Check if today SAM filtered log file exists"
  ansible.builtin.stat:
    path: "/usr/local/sam/kanshi/log/filtered/msg_filtered_{{ __rhel_post_check_today_compact }}.log"
  register: __rhel_post_check_sam_log_stat
 
- name: "Display SAM monitoring filtered log content"
  when: __rhel_post_check_sam_log_stat['stat']['exists'] | bool
  block:
 
    # フィルタログの内容を標準出力に取得・表示するため command を使用
    - name: "Cat SAM filtered log file"
      ansible.builtin.command: "cat /usr/local/sam/kanshi/log/filtered/msg_filtered_{{ __rhel_post_check_today_compact }}.log"
      register: __rhel_post_check_sam_log_content
      changed_when: false
 
    - name: "Display SAM log content"
      ansible.builtin.debug:
        msg:
          - "=== SAM Filtered Log (/usr/local/sam/kanshi/log/filtered/msg_filtered_{{ __rhel_post_check_today_compact }}.log) ==="
          - "{{ __rhel_post_check_sam_log_content['stdout_lines'] if (__rhel_post_check_sam_log_content['stdout'] | trim | length > 0) else ['(ログファイルは空です)'] }}"
 
- name: "Display message if SAM filtered log file does not exist"
  ansible.builtin.debug:
    msg: "[WARNING] SAM監視ログファイルが存在しません (/usr/local/sam/kanshi/log/filtered/msg_filtered_{{ __rhel_post_check_today_compact }}.log)。ファイルの存在有無を確認してください。"
  when: not (__rhel_post_check_sam_log_stat['stat']['exists'] | bool)
 
# ==================================================
# 2. httpd/jboss サービス状態の復元・起動確認、ヘルスチェック
# ==================================================
- name: "Gather service facts"
  ansible.builtin.service_facts:
 
# --------------------------------------------------
# 2-1. 開発環境: rhel_pre_check で保存した起動状態に復元
# --------------------------------------------------
- name: "Restore httpd/jboss services to their pre-check states (development environment only)"
  when: is_develop_env | default(false) | bool
  block:
 
    # 状態保存ファイルは rhel_pre_check 時にサービスが起動していた場合にだけ作成されるため、
    # ファイルがない場合は異常とせず、そのサービス種別の起動処理をスキップする
    - name: "Check if service state files exist"
      ansible.builtin.stat:
        path: "{{ patch_evidence_dir }}/{{ item }}_running_services_pre_check.json"
      loop:
        - httpd
        - jboss
      register: __rhel_post_check_service_state_files
 
    - name: "Display skip message when service state file does not exist"
      ansible.builtin.debug:
        msg: "{{ item['item'] }}_running_services_pre_check.jsonが存在しないため、起動処理をスキップします"
      loop: "{{ __rhel_post_check_service_state_files['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"
      when: not (item['stat']['exists'] | bool)
 
    - name: "Read service state files that exist"
      ansible.builtin.slurp:
        src: "{{ patch_evidence_dir }}/{{ item }}_running_services_pre_check.json"
      loop: "{{ __rhel_post_check_service_state_files['results'] | selectattr('stat.exists') | map(attribute='item') | list }}"
      register: __rhel_post_check_service_state_contents
 
    - name: "Restore httpd services to their pre-check states"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "{{ 'started' if item in __rhel_post_check_httpd_running_services else 'stopped' }}"
      become: true
      vars:
        __rhel_post_check_httpd_running_services: >-
          {{ __rhel_post_check_service_state_contents['results'] | selectattr('item', 'equalto', 'httpd')
             | map(attribute='content') | first | b64decode | from_json }}
      loop: "{{ rhel_post_check_httpd_services | default([]) }}"
      when:
        - "'httpd' in (__rhel_post_check_service_state_contents['results'] | map(attribute='item') | list)"
        - (item ~ '.service') in ansible_facts['services']
 
    - name: "Restore jboss services to their pre-check states"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "{{ 'started' if item in __rhel_post_check_jboss_running_services else 'stopped' }}"
      become: true
      vars:
        __rhel_post_check_jboss_running_services: >-
          {{ __rhel_post_check_service_state_contents['results'] | selectattr('item', 'equalto', 'jboss')
             | map(attribute='content') | first | b64decode | from_json }}
      loop: "{{ rhel_post_check_jboss_services | default([]) }}"
      when:
        - "'jboss' in (__rhel_post_check_service_state_contents['results'] | map(attribute='item') | list)"
        - (item ~ '.service') in ansible_facts['services']
 
# --------------------------------------------------
# 2-2. プレ本・本番環境: 停止したサービスの起動確認
# --------------------------------------------------
- name: "Verify stopped services are running (pre-production and production environments)"
  when: not (is_develop_env | default(false) | bool)
  block:
 
    - name: "Assert services listed in rhel_post_check_stop_services are running"
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item ~ '.service']['state'] == 'running'
        fail_msg: >-
          The service {{ item }} is not running.
          Check it with "systemctl status {{ item }}" on the target server, start it, and then rerun this playbook.
        success_msg: "The service {{ item }} is running"
      loop: "{{ rhel_post_check_stop_services | default([]) }}"
 
# --------------------------------------------------
# 2-3. ヘルスチェック（変数が設定されている場合のみ実行）
#   rhel_post_check_health_chk_paths : Apache 経由
#   rhel_post_check_health_chk_jboss : JBoss 経由
# 実行結果の判定は、総合サマリに OK / NG / 対象外 を表示した後、6. の最後の assert で行う
# --------------------------------------------------
# 社内ヘルスチェックスクリプトを実行する専用モジュールが無いため command を使用する。
# 結果は標準出力の文言で判定するため failed_when: false とする。
- name: "Run health check via Apache"
  ansible.builtin.command: "/bin/bash {{ item }} -o -a"
  become: true
  register: __rhel_post_check_health_chk_result
  changed_when: false
  failed_when: false
  loop: "{{ rhel_post_check_health_chk_paths | default([], true) }}"
 
# 社内ヘルスチェックスクリプトを実行する専用モジュールが無いため command を使用する。
# 結果は標準出力の文言で判定するため failed_when: false とする。
- name: "Run health check via JBoss"
  ansible.builtin.command: "/bin/bash {{ item['path'] }} -o -j {{ item['script'] }}"
  become: true
  register: __rhel_post_check_health_chk_jboss_result
  changed_when: false
  failed_when: false
  loop: "{{ rhel_post_check_health_chk_jboss | default([], true) }}"
 
# ==================================================
# 3. JP1サービス確認/起動（個別判定・順序保証版）
# ==================================================
- name: "Check if JP1 unit files exist"
  ansible.builtin.stat:
    path: "/usr/lib/systemd/system/{{ item }}"
  loop:
    - jp1_base.service
    - jp1_ajs3.service
  register: __rhel_post_check_jp1_stats
 
# --------------------------------------------------
# 3-1. jp1_base の起動（前提サービスのため必ず先に起動）
# --------------------------------------------------
- name: "Ensure jp1_base service is started"
  ansible.builtin.systemd:
    name: jp1_base
    state: started
  when: __rhel_post_check_jp1_stats['results'][0]['stat']['exists'] | bool
  register: __rhel_post_check_jp1_base_start
  ignore_errors: true
 
# --------------------------------------------------
# 3-2. jp1_ajs3 の起動（Base の後に起動）
# --------------------------------------------------
- name: "Ensure jp1_ajs3 service is started"
  ansible.builtin.systemd:
    name: jp1_ajs3
    state: started
  when: __rhel_post_check_jp1_stats['results'][1]['stat']['exists'] | bool
  register: __rhel_post_check_jp1_ajs3_start
  ignore_errors: true
 
# --------------------------------------------------
# 3-3. 存在するサービスのみステータス確認・ログ出力
# --------------------------------------------------
# エビデンス・ログ確認用に現在のサービス稼働詳細を取得するため command を使用
- name: "Get JP1 service status for existing services"
  ansible.builtin.command: "systemctl status {{ item['item'] }}"
  loop: "{{ __rhel_post_check_jp1_stats['results'] }}"
  when: item['stat']['exists'] | bool
  register: __rhel_post_check_jp1_status_result
  changed_when: false
  failed_when: false
 
- name: "Display JP1 services status"
  ansible.builtin.debug:
    msg:
      - "=== {{ item['item']['item'] }} Status ==="
      - "{{ item['stdout_lines'] }}"
  loop: "{{ __rhel_post_check_jp1_status_result['results'] | default([]) }}"
  when:
    - item['stdout_lines'] is defined
    - item['skipped'] is not defined or not (item['skipped'] | bool)
 
- name: "Display skip message when no JP1 services are installed"
  ansible.builtin.debug:
    msg: "[INFO] Neither jp1_base nor jp1_ajs3 is installed. Skipping JP1 check."
  when:
    - not (__rhel_post_check_jp1_stats['results'][0]['stat']['exists'] | bool)
    - not (__rhel_post_check_jp1_stats['results'][1]['stat']['exists'] | bool)
 
# ==================================================
# 4. EDR の正常性確認
# ==================================================
- name: "Check if falconctl executable exists"
  ansible.builtin.stat:
    path: "/opt/CrowdStrike/falconctl"
  register: __rhel_post_check_falconctl_stat
 
- name: "Verify CrowdStrike Falcon RFM state"
  when: __rhel_post_check_falconctl_stat['stat']['exists'] | bool
  block:
 
    # 専用モジュールが存在しないベンダー独自CLIの実行のため command を使用
    - name: "Get CrowdStrike Falcon RFM state"
      ansible.builtin.command: "/opt/CrowdStrike/falconctl -g --rfm-state"
      register: __rhel_post_check_rfm_result
      changed_when: false
      failed_when: false
 
    - name: "Display CrowdStrike Falcon RFM check result"
      ansible.builtin.debug:
        msg: >-
          {{
           '[OK] CrowdStrike Falcon の RFM ステータスは正常 (rfm-state=false.) です。'
           if ('rfm-state=false.' in __rhel_post_check_rfm_result['stdout'])
           else '[WARNING] CrowdStrike Falcon の RFM ステータス異常を検知しました: ' ~ (__rhel_post_check_rfm_result['stdout'] | trim) ~ '。EDRの状態を確認してください'
          }}
 
- name: "Display skip message when falconctl is not installed"
  ansible.builtin.debug:
    msg: "[INFO] CrowdStrike falconctl is not found. Skipping EDR health check."
  when: not (__rhel_post_check_falconctl_stat['stat']['exists'] | bool)
 
# ==================================================
# 5. 監視抑止ファイルの存在確認・削除
# ==================================================
# ディレクトリ配下の詳細エビデンス（更新時刻・パーミッション）を出力するため command を使用
- name: "List SAM temporary directory contents initially"
  ansible.builtin.command: "ls -l /usr/local/sam/kanshi/tmp"
  register: __rhel_post_check_sam_tmp_initial
  changed_when: false
  failed_when: false
 
- name: "Display initial SAM temporary directory contents"
  ansible.builtin.debug:
    msg: "{{ __rhel_post_check_sam_tmp_initial['stdout_lines'] | default(['Directory not accessible']) }}"
 
- name: "Find and remove today modified DISABLE files in SAM temporary directory"
  block:
 
    # 監視抑止ファイルの探索（タイムスタンプ比較のため find モジュールを使用）
    - name: "Find today modified DISABLE files in SAM temporary directory"
      ansible.builtin.find:
        paths: "/usr/local/sam/kanshi/tmp"
        patterns: "DISABLE*"
      register: __rhel_post_check_disable_files
 
    # 作業日当日に更新・作成された DISABLE ファイルを削除（冪等性を担保）
    - name: "Remove today modified DISABLE files"
      ansible.builtin.file:
        path: "{{ item['path'] }}"
        state: absent
      loop: "{{ __rhel_post_check_disable_files['files'] | default([]) }}"
      when:
        - ('%Y-%m-%d' | strftime(item['mtime'])) == __rhel_post_check_today_hyphen
      register: __rhel_post_check_removed_disable_files
 
  rescue:
 
    - name: "Display error when DISABLE files cleanup fails"
      ansible.builtin.debug:
        msg:
          - "[WARNING] 監視抑止ファイル (DISABLE*) の検索または削除に失敗しました。処理は継続します。"
          - "失敗タスク: {{ ansible_failed_task['name'] | default('不明') }}"
          - "エラー内容: {{ ansible_failed_result['msg'] | default('メッセージなし') }}"
          - "/usr/local/sam/kanshi/tmp 配下の DISABLE* ファイルとパーミッションを確認し、必要に応じて手動で削除してください。"
 
# 削除後状態の確認のため command を使用
- name: "List SAM temporary directory contents after cleanup"
  ansible.builtin.command: "ls -l /usr/local/sam/kanshi/tmp"
  register: __rhel_post_check_sam_tmp_final
  changed_when: false
  failed_when: false
 
- name: "Display final SAM temporary directory contents"
  ansible.builtin.debug:
    msg: "{{ __rhel_post_check_sam_tmp_final['stdout_lines'] | default(['Directory not accessible']) }}"
 
# ==================================================
# 6. ステータス確認の総合サマリ表示
# ==================================================
- name: "Display summary and assert health checks succeeded"
  vars:
    __rhel_post_check_health_chk_success_message: "ヘルスチェック処理が正常終了しました"
    __rhel_post_check_apache_results: "{{ __rhel_post_check_health_chk_result['results'] | default([]) | rejectattr('skipped', 'defined') | list }}"
    __rhel_post_check_jboss_results: "{{ __rhel_post_check_health_chk_jboss_result['results'] | default([]) | rejectattr('skipped', 'defined') | list }}"
    __rhel_post_check_apache_failed: >-
      {{ __rhel_post_check_apache_results
         | rejectattr('stdout', 'search', __rhel_post_check_health_chk_success_message) | list }}
    __rhel_post_check_jboss_failed: >-
      {{ __rhel_post_check_jboss_results
         | rejectattr('stdout', 'search', __rhel_post_check_health_chk_success_message) | list }}
  block:
 
    - name: "Display overall agent check summary"
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "       AGENT STATUS CHECK SUMMARY      "
          - "=================================================="
          - "SAM Log Check   : msg_filtered_{{ __rhel_post_check_today_compact }}.logの内容を確認"
          - "JP1 Services    : {{ 'FAILED TO START : systemctl status jp1_base / jp1_ajs3 を確認してください' if ((__rhel_post_check_jp1_base_start['failed'] | default(false)) or (__rhel_post_check_jp1_ajs3_start['failed'] | default(false))) else ('OK' if (__rhel_post_check_jp1_stats['results'][0]['stat']['exists'] | default(false)) else 'SKIPPED') }}"
          - "Health Check Apache: {{ '対象外' if (__rhel_post_check_apache_results | length == 0) else ('NG' if (__rhel_post_check_apache_failed | length > 0) else 'OK') }}"
          - "Health Check Jboss : {{ '対象外' if (__rhel_post_check_jboss_results | length == 0) else ('NG' if (__rhel_post_check_jboss_failed | length > 0) else 'OK') }}"
          - "EDR  : {{ 'OK' if ('rfm-state=false.' in (__rhel_post_check_rfm_result['stdout'] | default(''))) else ('WARNING (Not false) : EDRの状態を確認してください' if (__rhel_post_check_falconctl_stat['stat']['exists'] | default(false)) else 'SKIPPED') }}"
          - "DISABLE Files Purge: {{ 'PURGED (' ~ (__rhel_post_check_removed_disable_files['results'] | default([]) | selectattr('changed', 'equalto', true) | list | length) ~ ' files)' if (__rhel_post_check_disable_files['files'] | default([]) | length > 0) else 'NONE' }}"
          - "=================================================="
 
    # サマリを表示した後に判定することで、ヘルスチェックが NG でも他の確認結果を先に出力する
    - name: "Assert health checks via Apache and JBoss succeeded"
      ansible.builtin.assert:
        that:
          - __rhel_post_check_apache_failed | length == 0
          - __rhel_post_check_jboss_failed | length == 0
        fail_msg: >-
          ヘルスチェックが異常終了しました。
          Apache経由: {{ __rhel_post_check_apache_failed | map(attribute='item') | list | join(', ') | default('なし', true) }}
          / JBoss経由: {{ __rhel_post_check_jboss_failed | map(attribute='item') | map(attribute='script') | list | join(', ') | default('なし', true) }}
          対象サーバで該当スクリプトを直接実行して原因を確認し、解消後に再実行してください。
        success_msg: "The health checks via Apache and JBoss succeeded or were not targeted"
