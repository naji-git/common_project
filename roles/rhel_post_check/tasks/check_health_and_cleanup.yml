---
# ==================================================
# 1. パッチ格納ディレクトリの削除
# ==================================================
- name: "Remove patch storage directory"
  ansible.builtin.file:
    path: "{{ patch_storage_dir }}"
    state: absent
 
- name: "Verify patch storage directory is removed"
  ansible.builtin.stat:
    path: "{{ patch_storage_dir }}"
  register: __rhel_post_check_patch_dir_stat
 
- name: "Assert patch storage directory does not exist"
  ansible.builtin.assert:
    that:
      - not __rhel_post_check_patch_dir_stat['stat']['exists']
    fail_msg: >-
      [ERROR] {{ patch_storage_dir }} の削除に失敗しました。ファイルが他プロセスに使用されていないか、パーミッションを確認して手動で削除してください。
    success_msg: "[OK] {{ patch_storage_dir }} は正常に削除されました。"
 
# ==================================================
# 2. パッチ作業ディレクトリのリネーム退避
# ==================================================
- name: "Find patch_mythos directories or files"
  ansible.builtin.find:
    paths: "{{ patch_base_dir }}"
    patterns: "patch_mythos*"
    file_type: any
  register: __rhel_post_check_mythos_targets
 
- name: "Remove patch_mythos targets"
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    state: absent
  loop: "{{ __rhel_post_check_mythos_targets['files'] }}"
 
- name: "Check if patch_evidence_dir directory exists"
  ansible.builtin.stat:
    path: "{{ patch_evidence_dir }}"
  register: __rhel_post_check_rhel_patch_stat
 
- name: "Archive and cleanup patch_evidence_dir directory"
  vars:
    __rhel_post_check_archive_dir: "{{ patch_base_dir }}/{{ patch_work_year }}_{{ patch_delivery_month }}_old"
  when: __rhel_post_check_rhel_patch_stat['stat']['exists'] | bool
  block:
 
    - name: "Create archive directory"
      ansible.builtin.file:
        path: "{{ __rhel_post_check_archive_dir }}"
        state: directory
        mode: "0755"
 
    # ワイルドカード展開を伴う一括移動のため shell を使用
    - name: "Move contents from patch_evidence_dir to archive directory"
      ansible.builtin.shell: >-
        mv "{{ patch_evidence_dir }}"/* "{{ __rhel_post_check_archive_dir }}/"
      changed_when: true
 
    - name: "Remove patch_evidence_dir directory"
      ansible.builtin.file:
        path: "{{ patch_evidence_dir }}"
        state: absent
 
    - name: "Verify patch_evidence_dir directory is removed"
      ansible.builtin.stat:
        path: "{{ patch_evidence_dir }}"
      register: __rhel_post_check_rhel_patch_check
 
    - name: "Assert patch_evidence_dir directory is removed"
      ansible.builtin.assert:
        that:
          - not __rhel_post_check_rhel_patch_check['stat']['exists']
        fail_msg: >-
          [ERROR] {{ patch_evidence_dir }} の削除に失敗しました。残存ファイルを確認の上、手動で退避または削除を実施してください。
        success_msg: "[OK] {{ patch_evidence_dir }} は正常に退避・削除されました。"
 
# ==================================================
# 3. パッチ作業ディレクトリのローテーション (5世代保持)
# ==================================================
- name: "Find existing archive directories"
  ansible.builtin.find:
    paths: "{{ patch_base_dir }}"
    file_type: directory
    patterns: "^[0-9]{4}_[0-9]{2}_old$"
    use_regex: true
  register: __rhel_post_check_archive_dirs
 
# ディレクトリ名で昇順ソートし、最新5世代から漏れた古いディレクトリを抽出
- name: "Determine old archive directories to purge"
  ansible.builtin.set_fact:
    __rhel_post_check_dirs_to_remove: >-
      {{
       (__rhel_post_check_archive_dirs['files'] | map(attribute='path') | sort)[:-5]
       if (__rhel_post_check_archive_dirs['files'] | length > 5)
       else []
      }}
 
- name: "Display rotation status"
  ansible.builtin.debug:
    msg:
      - "=== パッチ退避ディレクトリ ローテーション確認 ==="
      - "検出総数  : {{ __rhel_post_check_archive_dirs['files'] | length }} 世代"
      - "保持上限  : 5 世代"
      - "削除対象件数: {{ __rhel_post_check_dirs_to_remove | length }} 件"
      - "削除対象一覧: {{ __rhel_post_check_dirs_to_remove }}"
 
- name: "Remove old archive directories exceeding 5 generations"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ __rhel_post_check_dirs_to_remove }}"
  when: __rhel_post_check_dirs_to_remove | length > 0
 
- name: "Display skip message if total generations are within limit"
  ansible.builtin.debug:
    msg: "[INFO] 退避ディレクトリは5世代以下のため、ローテーション削除はスキップされました。"
  when: __rhel_post_check_dirs_to_remove | length == 0