- name: プロセス状態確認
  ansible.builtin.command: /usr/local/sam/kanshi/shell/sk_proc_dsp.sh
  register: process_status
  changed_when: false

- name: プロセス状態確認結果保存
  ansible.builtin.copy:
    content: "{{ process_status.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/process_status_after"
    mode: '0644'

- name: カーネルバージョン確認
  command: uname -r
  register: kernel_version
  changed_when: false

- name: カーネルバージョン結果保存
  copy:
    content: "{{ kernel_version.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/kernel_version_after"
    mode: '0644'

- name: サービス自動起動設定確認
  shell: >
    systemctl list-unit-files | grep -Ev '\.(scope|slice)'
  register: unit_files
  changed_when: false

- name: サービス自動起動設定結果保存
  copy:
    content: "{{ unit_files.stdout }}\n"
    dest: "{{ patch_evidence_dir }}/unit-files_after"
    mode: '0644'

- name: Javaディレクトリ存在確認
  ansible.builtin.stat:
    path: /usr/lib/jvm
  register: jvm_dir

- name: Java関連ファイル確認・保存ブロック
  when: jvm_dir.stat.exists
  block:
    - name: Java関連ファイル確認
      ansible.builtin.command: ls -l /usr/lib/jvm
      register: java_info
      changed_when: false

    - name: Java関連ファイル結果保存
      ansible.builtin.copy:
        content: "{{ java_info.stdout }}\n"
        dest: "{{ patch_evidence_dir }}/java_info_after"
        mode: '0644'

# ==================================================
# 作業前後での比較処理
# ==================================================

# --------------------------------------------------
# 1. Java 情報の比較・表示
# --------------------------------------------------
- name: 事前Javaファイルからバージョン文字列を抽出
  ansible.builtin.shell: >
    grep -E 'java-[0-9].*el[0-9]' {{ patch_evidence_dir }}/java_info_before 2>/dev/null |
    awk '{print $NF}' | head -n 1
  register: java_ver_before_cmd
  failed_when: false
  changed_when: false

- name: 事後Javaファイルからバージョン文字列を抽出
  ansible.builtin.shell: >
    grep -E 'java-[0-9].*el[0-9]' {{ patch_evidence_dir }}/java_info_after 2>/dev/null |
    awk '{print $NF}' | head -n 1
  register: java_ver_after_cmd
  failed_when: false
  changed_when: false

- name: 変数へ格納
  ansible.builtin.set_fact:
    java_ver_before: "{{ (java_ver_before_cmd.stdout | trim) if (java_ver_before_cmd.stdout | trim | length > 0) else '事前ファイルなし または 未特定' }}"
    java_ver_after: "{{ (java_ver_after_cmd.stdout | trim) if (java_ver_after_cmd.stdout | trim | length > 0) else 'Java未検出' }}"

- name: Java バージョン比較結果表示
  ansible.builtin.debug:
    msg:
      - "=== Java バージョン比較 ==="
      - "作業前: {{ java_ver_before }}"
      - "作業後: {{ java_ver_after }}"
      - "変更有無: {{ '変更あり (バージョンアップ検知)' if (java_ver_before != java_ver_after and java_ver_before != '事前ファイルなし または 未特定') else '変更なし' }}"

# --------------------------------------------------
# 2. カーネルバージョンの比較・表示
# --------------------------------------------------
- name: 事前カーネルバージョンの読み込み
  ansible.builtin.slurp:
    src: "{{ patch_evidence_dir }}/kernel_version_before"
  register: kernel_before_b64
  ignore_errors: true

- name: カーネルバージョン比較結果表示
  ansible.builtin.debug:
    msg:
      - "=== Kernel Version 比較 ==="
      - "作業前: {{ (kernel_before_b64.content | b64decode | trim) if (kernel_before_b64 is succeeded) else '取得失敗またはファイルなし' }}"
      - "作業後: {{ kernel_version.stdout | trim }}"
      - "変更有無: {{ '変更あり (アップデート・再起動検知)' if (kernel_before_b64 is succeeded and (kernel_before_b64.content | b64decode | trim) != (kernel_version.stdout | trim)) else '変更なし' }}"

# --------------------------------------------------
# 3. サービス自動起動設定（unit-files）の差分抽出・表示
# --------------------------------------------------
- name: サービス自動起動設定の差分解析
  ansible.builtin.shell: |
    python3 - << 'EOF'
    import sys

    before_file = "{{ patch_evidence_dir }}/unit-files_before"
    after_file = "{{ patch_evidence_dir }}/unit-files_after"

    def parse_file(filepath):
        data = {}
        try:
            with open(filepath, 'r') as f:
                for line in f:
                    line_str = line.strip()
                    # フッター（"xxx unit files listed."）や空行、ヘッダー行を除外
                    if not line_str or 'unit files listed' in line_str or line_str.startswith('UNIT FILE'):
                        continue

                    parts = line_str.split()
                    # ユニット名と状態（最低2列以上）があり、ユニット名が英数字等で終わるものを対象
                    if len(parts) >= 2 and '.' in parts[0]:
                        unit_name = parts[0]
                        status = " ".join(parts[1:])
                        data[unit_name] = status
        except Exception:
            pass
        return data

    before = parse_file(before_file)
    after = parse_file(after_file)

    changes = []
    added = []
    removed = []

    # 変更および削除の検出
    for unit, b_stat in before.items():
        if unit in after:
            if b_stat != after[unit]:
                changes.append(f"【設定変更】 {unit}: [作業前] {b_stat}  -->  [作業後] {after[unit]}")
        else:
            removed.append(f"【削除】 {unit} (作業前の状態: {b_stat})")

    # 新規追加の検出
    for unit, a_stat in after.items():
        if unit not in before:
            added.append(f"【新規追加】 {unit}: [状態] {a_stat}")

    results = []
    if changes:
        results.extend(changes)
    if added:
        results.extend(added)
    if removed:
        results.extend(removed)

    if results:
        print("\n".join(results))
    else:
        print("差分なし")
    EOF
  register: unit_files_diff
  changed_when: false

- name: サービス自動起動設定 差分結果表示
  ansible.builtin.debug:
    msg: "{{ unit_files_diff.stdout_lines }}"

# --------------------------------------------------
# 4. プロセス状態（sk_proc_dsp.sh）の比較・表示
# --------------------------------------------------
- name: プロセス状態の判定比較 (事前:N -> 事後:N以外 を検知)
  ansible.builtin.shell: |
    python3 - << 'EOF'
    import sys

    before_file = "{{ patch_evidence_dir }}/process_status_before"
    after_file = "{{ patch_evidence_dir }}/process_status_after"

    def parse_proc_file(filepath):
        data = {}
        try:
            with open(filepath, 'r') as f:
                for line in f:
                    line_str = line.strip()
                    if not line_str or line_str.startswith('#'):
                        continue
                    parts = line_str.split()
                    # 形式に応じて対応: サービス名とステータス値
                    # 例1: "service_name N" -> service: parts[0], status: parts[1]
                    # 例2: 複数カラムで末尾がステータス値の場合にも対応
                    if len(parts) >= 2:
                        # 1列目をサービス名、2列目（または最後の列）をステータス値として保持
                        service_name = parts[0]
                        status = parts[1]
                        data[service_name] = status
        except Exception:
            pass
        return data

    before = parse_proc_file(before_file)
    after = parse_proc_file(after_file)

    not_n_services = []

    # 作業前にステータスが 'N' だったサービスを対象にチェック
    for service, b_stat in before.items():
        if b_stat == 'N':
            a_stat = after.get(service, '未検出/停止')
            if a_stat != 'N':
                not_n_services.append(f"【非N状態検知】 サービス名: {service} (事前: {b_stat} --> 事後: {a_stat})")

    if not_n_services:
        print("\n".join(not_n_services))
    else:
        print("正常 (事前でNのサービスはすべて事後もNです)")
    EOF
  register: process_status_check
  changed_when: false

- name: プロセス状態 判定結果表示
  ansible.builtin.debug:
    msg:
      - "==================== [プロセス状態判定結果] ===================="
      - "{{ process_status_check.stdout_lines }}"
      - "================================================================"