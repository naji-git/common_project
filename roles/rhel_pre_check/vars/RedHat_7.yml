---
# yum remove --assumeno 完了メッセージ
__rhel_pre_check_boot_space_dry_run_completed_message: "Exiting on user command"

# Remove と Package に挟まれた「数字のみ」に直接マッチさせる正規表現
__rhel_pre_check_boot_space_removal_count_regex: '(?<=Remove)\s+(\d+)(?=\s+Package)'

# 依存関係マーカー
__rhel_pre_check_boot_space_dependency_section_marker: "Removing for dependencies:"
__rhel_pre_check_boot_space_dependent_package_marker: "Removing dependent packages:"