---
- name: "Check if httpd configuration file exists"
  ansible.builtin.stat:
    path: "/etc/httpd/conf/httpd.conf"
  register: __rhel_pre_check_httpd_conf_stat
 
- name: "Backup and collect httpd configuration evidence"
  when: __rhel_pre_check_httpd_conf_stat['stat']['exists'] | bool
  block:
 
    - name: "Create evidence directory for patch operations"
      ansible.builtin.file:
        path: "{{ rhel_pre_check_patch_evidence_dir }}"
        state: directory
        mode: "0755"
 
    - name: "Find files under conf.modules.d directory"
      ansible.builtin.find:
        paths: "/etc/httpd/conf.modules.d"
        file_type: any
      register: __rhel_pre_check_conf_modules_list
 
    - name: "Save conf.modules.d file list to evidence file"
      ansible.builtin.copy:
        content: >-
          {{ (__rhel_pre_check_conf_modules_list['files']
              | map(attribute='path') | map('basename') | sort | join('\n')) ~ '\n' }}
        dest: "{{ rhel_pre_check_patch_evidence_dir }}/conf.modules.d_before"
        mode: "0644"
 
    - name: "Find files under conf.d directory"
      ansible.builtin.find:
        paths: "/etc/httpd/conf.d"
        file_type: any
      register: __rhel_pre_check_conf_d_list
 
    - name: "Save conf.d file list to evidence file"
      ansible.builtin.copy:
        content: >-
          {{ (__rhel_pre_check_conf_d_list['files']
              | map(attribute='path') | map('basename') | sort | join('\n')) ~ '\n' }}
        dest: "{{ rhel_pre_check_patch_evidence_dir }}/conf.d_before"
        mode: "0644"
 
    - name: "Check if httpd systemd service file exists"
      ansible.builtin.stat:
        path: "/usr/lib/systemd/system/httpd.service"
      register: __rhel_pre_check_httpd_service_stat
 
    - name: "Backup original httpd systemd service file"
      ansible.builtin.copy:
        src: "/usr/lib/systemd/system/httpd.service"
        dest: "{{ rhel_pre_check_patch_evidence_dir }}/httpd.service_before"
        remote_src: true
        mode: preserve
      when: __rhel_pre_check_httpd_service_stat['stat']['exists'] | bool
 
- name: "Display skip message when httpd is not installed"
  ansible.builtin.debug:
    msg: "httpd is not installed (/etc/httpd/conf/httpd.conf not found). Skipping httpd backup tasks."
  when: not (__rhel_pre_check_httpd_conf_stat['stat']['exists'] | bool)

