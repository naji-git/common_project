---
- name: "Check if httpd configuration file exists"
  ansible.builtin.stat:
    path: "/etc/httpd/conf/httpd.conf"
  register: __rhel_post_check_httpd_conf_stat
 
- name: "Restore httpd configuration and verify service state"
  when: __rhel_post_check_httpd_conf_stat['stat']['exists'] | bool
  block:
 
    - name: "Create evidence directory for patch operations"
      ansible.builtin.file:
        path: "{{ rhel_post_check_patch_evidence_dir }}"
        state: directory
        mode: "0755"
 
    - name: "Find files under conf.modules.d directory after patch"
      ansible.builtin.find:
        paths: "/etc/httpd/conf.modules.d"
        file_type: any
      register: __rhel_post_check_conf_modules_find
 
    - name: "Save conf.modules.d file list to evidence file"
      ansible.builtin.copy:
        content: "{{ (__rhel_post_check_conf_modules_after | join('\n')) ~ '\n' }}"
        dest: "{{ rhel_post_check_patch_evidence_dir }}/conf.modules.d_after"
        mode: "0644"
      vars:
        __rhel_post_check_conf_modules_after: >-
          {{ __rhel_post_check_conf_modules_find['files']
             | map(attribute='path') | map('basename') | sort | list }}
 
    - name: "Find files under conf.d directory after patch"
      ansible.builtin.find:
        paths: "/etc/httpd/conf.d"
        file_type: any
      register: __rhel_post_check_conf_d_find
 
    - name: "Save conf.d file list to evidence file"
      ansible.builtin.copy:
        content: "{{ (__rhel_post_check_conf_d_after | join('\n')) ~ '\n' }}"
        dest: "{{ rhel_post_check_patch_evidence_dir }}/conf.d_after"
        mode: "0644"
      vars:
        __rhel_post_check_conf_d_after: >-
          {{ __rhel_post_check_conf_d_find['files']
             | map(attribute='path') | map('basename') | sort | list }}
 
    - name: "Check if httpd systemd service file exists"
      ansible.builtin.stat:
        path: "/usr/lib/systemd/system/httpd.service"
      register: __rhel_post_check_httpd_service_stat
 
    - name: "Backup post-patch httpd systemd service file"
      ansible.builtin.copy:
        src: "/usr/lib/systemd/system/httpd.service"
        dest: "{{ rhel_post_check_patch_evidence_dir }}/httpd.service_after"
        remote_src: true
        mode: preserve
      when: __rhel_post_check_httpd_service_stat['stat']['exists'] | bool
 
    - name: "Check if pre-patch conf.modules.d file list exists"
      ansible.builtin.stat:
        path: "{{ rhel_post_check_patch_evidence_dir }}/conf.modules.d_before"
      register: __rhel_post_check_modules_before_stat
 
    - name: "Read pre-patch conf.modules.d file list"
      ansible.builtin.slurp:
        src: "{{ rhel_post_check_patch_evidence_dir }}/conf.modules.d_before"
      register: __rhel_post_check_modules_before_content
      when: __rhel_post_check_modules_before_stat['stat']['exists'] | bool
 
    - name: "Compare conf.modules.d against pre-patch state"
      when: __rhel_post_check_modules_before_stat['stat']['exists'] | bool
      vars:
        __rhel_post_check_modules_before: >-
          {{ (__rhel_post_check_modules_before_content['content'] | b64decode).splitlines()
             | map('trim') | reject('equalto', '') | list }}
        __rhel_post_check_modules_after: >-
          {{ __rhel_post_check_conf_modules_find['files']
             | map(attribute='path') | map('basename') | list }}
        __rhel_post_check_modules_added: >-
          {{ __rhel_post_check_modules_after | difference(__rhel_post_check_modules_before) | sort }}
        __rhel_post_check_modules_removed: >-
          {{ __rhel_post_check_modules_before | difference(__rhel_post_check_modules_after) | sort }}
      block:
 
        - name: "Restore conf.modules.d when difference is detected"
          when: (__rhel_post_check_modules_added | length > 0) or (__rhel_post_check_modules_removed | length > 0)
          block:
 
            # 差分として検知された余剰ファイルを退避ディレクトリに移動するため command を使用
            - name: "Move added files in conf.modules.d to evidence directory"
              ansible.builtin.command:
                argv:
                  - "mv"
                  - "/etc/httpd/conf.modules.d/{{ item }}"
                  - "{{ rhel_post_check_patch_evidence_dir }}/"
              become: true
              loop: "{{ __rhel_post_check_modules_added }}"
              changed_when: true
 
            - name: "Find files under conf.modules.d directory after cleanup"
              ansible.builtin.find:
                paths: "/etc/httpd/conf.modules.d"
                file_type: any
              register: __rhel_post_check_conf_modules_find_mv
 
            - name: "Save conf.modules.d file list after cleanup to evidence file"
              ansible.builtin.copy:
                content: "{{ (__rhel_post_check_modules_after_mv | join('\n')) ~ '\n' }}"
                dest: "{{ rhel_post_check_patch_evidence_dir }}/conf.modules.d_after_mv"
                mode: "0644"
              vars:
                __rhel_post_check_modules_after_mv: >-
                  {{ __rhel_post_check_conf_modules_find_mv['files']
                     | map(attribute='path') | map('basename') | sort | list }}
 
            - name: "Assert conf.modules.d matches pre-patch state"
              ansible.builtin.assert:
                that:
                  - __rhel_post_check_modules_remaining_added | length == 0
                  - __rhel_post_check_modules_remaining_removed | length == 0
                fail_msg: >-
                  [ERROR] conf.modules.d がパッチ適用前の構成と一致していません。
                  手動で /etc/httpd/conf.modules.d のファイル構成を確認してください。
                  パッチ適用前にないファイル: {{ __rhel_post_check_modules_remaining_added | join(', ') | default('なし', true) }}
                  パッチ適用前にあるが存在しないファイル: {{ __rhel_post_check_modules_remaining_removed | join(', ') | default('なし', true) }}
                success_msg: "[OK] conf.modules.d はパッチ適用前の構成と一致しています。"
              vars:
                __rhel_post_check_modules_after_mv: >-
                  {{ __rhel_post_check_conf_modules_find_mv['files']
                     | map(attribute='path') | map('basename') | list }}
                __rhel_post_check_modules_remaining_added: >-
                  {{ __rhel_post_check_modules_after_mv | difference(__rhel_post_check_modules_before) | sort }}
                __rhel_post_check_modules_remaining_removed: >-
                  {{ __rhel_post_check_modules_before | difference(__rhel_post_check_modules_after_mv) | sort }}
 
    - name: "Display skip message when pre-patch conf.modules.d file list does not exist"
      ansible.builtin.debug:
        msg: >-
          [WARNING] conf.modules.d_before が存在しません ({{ rhel_post_check_patch_evidence_dir }}/conf.modules.d_before)。
          比較確認処理をスキップします。ファイルの存在有無を確認してください。
      when: not (__rhel_post_check_modules_before_stat['stat']['exists'] | bool)
 
    - name: "Check if pre-patch conf.d file list exists"
      ansible.builtin.stat:
        path: "{{ rhel_post_check_patch_evidence_dir }}/conf.d_before"
      register: __rhel_post_check_confd_before_stat
 
    - name: "Read pre-patch conf.d file list"
      ansible.builtin.slurp:
        src: "{{ rhel_post_check_patch_evidence_dir }}/conf.d_before"
      register: __rhel_post_check_confd_before_content
      when: __rhel_post_check_confd_before_stat['stat']['exists'] | bool
 
    - name: "Compare conf.d against pre-patch state"
      when: __rhel_post_check_confd_before_stat['stat']['exists'] | bool
      vars:
        __rhel_post_check_confd_before: >-
          {{ (__rhel_post_check_confd_before_content['content'] | b64decode).splitlines()
             | map('trim') | reject('equalto', '') | list }}
        __rhel_post_check_confd_after: >-
          {{ __rhel_post_check_conf_d_find['files']
             | map(attribute='path') | map('basename') | list }}
        __rhel_post_check_confd_added: >-
          {{ __rhel_post_check_confd_after | difference(__rhel_post_check_confd_before) | sort }}
        __rhel_post_check_confd_removed: >-
          {{ __rhel_post_check_confd_before | difference(__rhel_post_check_confd_after) | sort }}
      block:
 
        - name: "Restore conf.d when difference is detected"
          when: (__rhel_post_check_confd_added | length > 0) or (__rhel_post_check_confd_removed | length > 0)
          block:
 
            # 差分として検知された余剰ファイルを退避ディレクトリに移動するため command を使用
            - name: "Move added files in conf.d to evidence directory"
              ansible.builtin.command:
                argv:
                  - "mv"
                  - "/etc/httpd/conf.d/{{ item }}"
                  - "{{ rhel_post_check_patch_evidence_dir }}/"
              become: true
              loop: "{{ __rhel_post_check_confd_added }}"
              changed_when: true
 
            - name: "Find files under conf.d directory after cleanup"
              ansible.builtin.find:
                paths: "/etc/httpd/conf.d"
                file_type: any
              register: __rhel_post_check_conf_d_find_mv
 
            - name: "Save conf.d file list after cleanup to evidence file"
              ansible.builtin.copy:
                content: "{{ (__rhel_post_check_confd_after_mv | join('\n')) ~ '\n' }}"
                dest: "{{ rhel_post_check_patch_evidence_dir }}/conf.d_after_mv"
                mode: "0644"
              vars:
                __rhel_post_check_confd_after_mv: >-
                  {{ __rhel_post_check_conf_d_find_mv['files']
                     | map(attribute='path') | map('basename') | sort | list }}
 
            - name: "Assert conf.d matches pre-patch state"
              ansible.builtin.assert:
                that:
                  - __rhel_post_check_confd_remaining_added | length == 0
                  - __rhel_post_check_confd_remaining_removed | length == 0
                fail_msg: >-
                  [ERROR] conf.d がパッチ適用前の構成と一致していません。
                  手動で /etc/httpd/conf.d のファイル構成を確認してください。
                  パッチ適用前にないファイル: {{ __rhel_post_check_confd_remaining_added | join(', ') | default('なし', true) }}
                  パッチ適用前にあるが存在しないファイル: {{ __rhel_post_check_confd_remaining_removed | join(', ') | default('なし', true) }}
                success_msg: "[OK] conf.d はパッチ適用前の構成と一致しています。"
              vars:
                __rhel_post_check_confd_after_mv: >-
                  {{ __rhel_post_check_conf_d_find_mv['files']
                     | map(attribute='path') | map('basename') | list }}
                __rhel_post_check_confd_remaining_added: >-
                  {{ __rhel_post_check_confd_after_mv | difference(__rhel_post_check_confd_before) | sort }}
                __rhel_post_check_confd_remaining_removed: >-
                  {{ __rhel_post_check_confd_before | difference(__rhel_post_check_confd_after_mv) | sort }}
 
    - name: "Display skip message when pre-patch conf.d file list does not exist"
      ansible.builtin.debug:
        msg: >-
          [WARNING] conf.d_before が存在しません ({{ rhel_post_check_patch_evidence_dir }}/conf.d_before)。
          比較確認処理をスキップします。ファイルの存在有無を確認してください。
      when: not (__rhel_post_check_confd_before_stat['stat']['exists'] | bool)
 
    - name: "Check if pre-patch httpd systemd service file exists"
      ansible.builtin.stat:
        path: "{{ rhel_post_check_patch_evidence_dir }}/httpd.service_before"
      register: __rhel_post_check_httpd_service_before_stat
 
    - name: "Restore httpd systemd service file and verify service state"
      when: __rhel_post_check_httpd_service_before_stat['stat']['exists'] | bool
      block:
 
        - name: "Restore pre-patch httpd systemd service file"
          ansible.builtin.copy:
            src: "{{ rhel_post_check_patch_evidence_dir }}/httpd.service_before"
            dest: "/usr/lib/systemd/system/httpd.service"
            remote_src: true
            mode: "0644"
          become: true
 
        - name: "Reload systemd daemon configuration"
          ansible.builtin.systemd:
            daemon_reload: true
          become: true
 
        # 起動直前のステータス詳細（ログ出力）を取得する専用モジュールがないため command を使用。
        # 停止中を示す終了コード 3 は異常ではないため failed_when で除外する
        - name: "Check httpd service status before starting"
          ansible.builtin.command: "systemctl status httpd.service"
          register: __rhel_post_check_httpd_status_before_start
          changed_when: false
          failed_when: __rhel_post_check_httpd_status_before_start['rc'] not in [0, 3]
 
        - name: "Ensure httpd service is started"
          ansible.builtin.systemd:
            name: "httpd"
            state: started
          become: true
 
        # 起動直後のステータス詳細（アクティブ状態確認）を取得する専用モジュールがないため command を使用
        - name: "Verify httpd service is active after start"
          ansible.builtin.command: "systemctl status httpd.service"
          register: __rhel_post_check_httpd_status_after_start
          changed_when: false
 
    - name: "Display skip message when pre-patch httpd systemd service file does not exist"
      ansible.builtin.debug:
        msg: >-
          [WARNING] httpd.service_before が存在しません ({{ rhel_post_check_patch_evidence_dir }}/httpd.service_before)。
          httpd復旧をスキップします。httpd.serviceの内容確認後、httpd.serviceを起動させてください。
      when: not (__rhel_post_check_httpd_service_before_stat['stat']['exists'] | bool)
 
- name: "Display skip message when httpd is not installed"
  ansible.builtin.debug:
    msg: "httpd未導入のため処理をスキップします。"
  when: not (__rhel_post_check_httpd_conf_stat['stat']['exists'] | bool)

