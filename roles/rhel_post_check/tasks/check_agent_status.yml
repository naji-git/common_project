---
# ==================================================
# 1. SAM監視ログ確認（作業時間帯フィルタ版）
# ==================================================
- name: "Set today date formatted variable"
  ansible.builtin.set_fact:
    __rhel_post_check_today_compact: "{{ ansible_facts['date_time']['date'] | replace('-', '') }}"
    __rhel_post_check_today_hyphen: "{{ ansible_facts['date_time']['date'] }}"

# 開始支点となる事前確認ファイルのタイムスタンプを取得（固定パス指定）
- name: "Check stat of pre-check cpu usage file for start time"
  ansible.builtin.stat:
    path: "/home/infra/rhel_patch/cpu_usage_before"
  register: __rhel_post_check_pre_file_stat

- name: "Check if today SAM filtered log file exists"
  ansible.builtin.stat:
    path: "/usr/local/sam/kanshi/log/filtered/msg_filtered_{{ __rhel_post_check_today_compact }}.log"
  register: __rhel_post_check_sam_log_stat

- name: "Analyze SAM monitoring log for unexpected errors"
  when: __rhel_post_check_sam_log_stat.stat.exists | bool
  block:
    - name: "Extract unignored log entries within maintenance time range"
      ansible.builtin.shell: |
        python3 - << 'EOF'
        import datetime
        import re
        import sys
        import time

        log_path = "/usr/local/sam/kanshi/log/filtered/msg_filtered_{{ __rhel_post_check_today_compact }}.log"
        patterns = {{ rhel_post_check_sam_log_ignore_patterns | default([]) | to_json }}
        compiled_patterns = [re.compile(p) for p in patterns]

        # 開始時刻（事前確認ファイルが存在すればそのmtime、なければ0）
        pre_file_mtime = {{ __rhel_post_check_pre_file_stat.stat.mtime | default(0) }}
        start_ts = float(pre_file_mtime)

        # 終了時刻（現在実行時刻）
        end_ts = time.time()

        unexpected_errors = []
        try:
            with open(log_path, 'r', encoding='utf-8', errors='ignore') as f:
                for line in f:
                    line_clean = line.strip()
                    if not line_clean:
                        continue

                    parts = line_clean.split(',')
                    if len(parts) >= 2:
                        try:
                            dt_str = f"{parts[0]} {parts[1]}"
                            log_dt = datetime.datetime.strptime(dt_str, "%Y%m%d %H:%M:%S")
                            log_ts = log_dt.timestamp()

                            if log_ts < start_ts or log_ts > end_ts:
                                continue
                        except ValueError:
                            pass

                    if not any(cp.search(line_clean) for cp in compiled_patterns):
                        unexpected_errors.append(line_clean)
        except Exception as e:
            print(f"ERROR: {e}", file=sys.stderr)
            sys.exit(0)

        for err in unexpected_errors:
            print(err)
        EOF
      register: __rhel_post_check_sam_log_errors
      changed_when: false

    - name: "Display SAM monitoring log check result"
      ansible.builtin.debug:
        msg: >-
          {{
            ['[WARNING] パッチ作業時間帯のSAM監視ログ内に未除外のエラー/警告メッセージが検知されました:'] + __rhel_post_check_sam_log_errors.stdout_lines
            if (__rhel_post_check_sam_log_errors.stdout | trim | length > 0)
            else ['[OK] パッチ作業時間帯のSAM監視ログに問題のあるメッセージは検出されませんでした。']
          }}

# ==================================================
# 2. JP1サービス確認/起動（個別判定・順序保証版）
# ==================================================
- name: "Check if JP1 unit files exist"
  ansible.builtin.stat:
    path: "/usr/lib/systemd/system/{{ item }}"
  loop:
    - jp1_base.service
    - jp1_ajs3.service
  register: __rhel_post_check_jp1_stats

- name: "Set JP1 existence facts"
  ansible.builtin.set_fact:
    __rhel_post_check_jp1_base_exists: "{{ __rhel_post_check_jp1_stats.results[0].stat.exists | bool }}"
    __rhel_post_check_jp1_ajs3_exists: "{{ __rhel_post_check_jp1_stats.results[1].stat.exists | bool }}"

# --------------------------------------------------
# 2-1. jp1_base の起動（前提基盤のため必ず先に起動）
# --------------------------------------------------
- name: "Ensure jp1_base service is started"
  ansible.builtin.systemd:
    name: jp1_base
    state: started
  when: __rhel_post_check_jp1_base_exists
  register: __rhel_post_check_jp1_base_start
  ignore_errors: true

# --------------------------------------------------
# 2-2. jp1_ajs3 の起動（Base の後に起動）
# --------------------------------------------------
- name: "Ensure jp1_ajs3 service is started"
  ansible.builtin.systemd:
    name: jp1_ajs3
    state: started
  when: __rhel_post_check_jp1_ajs3_exists
  register: __rhel_post_check_jp1_ajs3_start
  ignore_errors: true

# --------------------------------------------------
# 2-3. 存在するサービスのみステータス確認・ログ出力
# --------------------------------------------------
# エビデンス・ログ確認用に現在のサービス稼働詳細を取得するため command を使用
- name: "Get JP1 service status for existing services"
  ansible.builtin.command: "systemctl status {{ item.item }}"
  loop: "{{ __rhel_post_check_jp1_stats.results }}"
  when: item.stat.exists | bool
  register: __rhel_post_check_jp1_status_result
  changed_when: false
  failed_when: false

- name: "Display JP1 services status"
  ansible.builtin.debug:
    msg:
      - "=== {{ item.item.item }} Status ==="
      - "{{ item.stdout_lines }}"
  loop: "{{ __rhel_post_check_jp1_status_result.results | default([]) }}"
  when:
    - item.stdout_lines is defined
    - item.skipped is not defined or not item.skipped

- name: "Display skip message when no JP1 services are installed"
  ansible.builtin.debug:
    msg: "[INFO] Neither jp1_base nor jp1_ajs3 is installed. Skipping JP1 check."
  when:
    - not __rhel_post_check_jp1_base_exists
    - not __rhel_post_check_jp1_ajs3_exists

# ==================================================
# 3. EDR (CrowdStrike Falcon) の正常性確認
# ==================================================
- name: "Check if falconctl executable exists"
  ansible.builtin.stat:
    path: "/opt/CrowdStrike/falconctl"
  register: __rhel_post_check_falconctl_stat

- name: "Verify CrowdStrike Falcon RFM state"
  when: __rhel_post_check_falconctl_stat.stat.exists | bool
  block:
    # 専用モジュールが存在しないベンダー独自CLIの実行のため command を使用
    - name: "Get CrowdStrike Falcon RFM state"
      ansible.builtin.command: "/opt/CrowdStrike/falconctl -g --rfm-state"
      register: __rhel_post_check_rfm_result
      changed_when: false
      failed_when: false

    # 異常があっても落とさず、警告メッセージとして出力
    - name: "Display CrowdStrike Falcon RFM check result"
      ansible.builtin.debug:
        msg: >-
          {{
            '[OK] CrowdStrike Falcon の RFM ステータスは正常 (rfm-state=false.) です。'
            if ('rfm-state=false.' in __rhel_post_check_rfm_result.stdout)
            else '[WARNING] CrowdStrike Falcon の RFM ステータス異常を検知しました: ' ~ (__rhel_post_check_rfm_result.stdout | trim)
          }}

- name: "Display skip message when falconctl is not installed"
  ansible.builtin.debug:
    msg: "[INFO] CrowdStrike falconctl is not found. Skipping EDR health check."
  when: not (__rhel_post_check_falconctl_stat.stat.exists | bool)

# ==================================================
# 4. 監視抑止ファイルの存在確認・削除
# ==================================================
# ディレクトリ配下の詳細エビデンス（更新時刻・パーミッション）を出力するため command を使用
- name: "List SAM temporary directory contents initially"
  ansible.builtin.command: "ls -l /usr/local/sam/kanshi/tmp"
  register: __rhel_post_check_sam_tmp_initial
  changed_when: false
  failed_when: false

- name: "Display initial SAM temporary directory contents"
  ansible.builtin.debug:
    msg: "{{ __rhel_post_check_sam_tmp_initial.stdout_lines | default(['Directory not accessible']) }}"

# 監視抑止ファイルの探索（タイムスタンプ比較のため find モジュールを使用）
- name: "Find today modified DISABLE files in SAM temporary directory"
  ansible.builtin.find:
    paths: "/usr/local/sam/kanshi/tmp"
    patterns: "DISABLE*"
  register: __rhel_post_check_disable_files
  ignore_errors: true

# 作業日当日に更新・作成された DISABLE ファイルを削除（冪等性を担保）
- name: "Remove today modified DISABLE files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ __rhel_post_check_disable_files.files | default([]) }}"
  when:
    - ('%Y-%m-%d' | strftime(item.mtime)) == __rhel_post_check_today_hyphen
  register: __rhel_post_check_removed_disable_files
  ignore_errors: true

# 削除後状態の確認のため command を使用
- name: "List SAM temporary directory contents after cleanup"
  ansible.builtin.command: "ls -l /usr/local/sam/kanshi/tmp"
  register: __rhel_post_check_sam_tmp_final
  changed_when: false
  failed_when: false

- name: "Display final SAM temporary directory contents"
  ansible.builtin.debug:
    msg: "{{ __rhel_post_check_sam_tmp_final.stdout_lines | default(['Directory not accessible']) }}"

# ==================================================
# 5. ステータス確認の総合サマリ表示
# ==================================================
- name: "Display overall agent check summary"
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "             AGENT STATUS CHECK SUMMARY           "
      - "=================================================="
      - "SAM Log Check      : {{ 'WARNING (Check logs)' if (__rhel_post_check_sam_log_errors.stdout | default('') | trim | length > 0) else 'OK' }}"
      - "JP1 Services       : {{ 'FAILED TO START' if ((__rhel_post_check_jp1_base_start.failed | default(false)) or (__rhel_post_check_jp1_ajs3_start.failed | default(false))) else ('OK' if (__rhel_post_check_jp1_stats.results[0].stat.exists | default(false)) else 'SKIPPED') }}"
      - "CrowdStrike RFM    : {{ 'OK' if ('rfm-state=false.' in (__rhel_post_check_rfm_result.stdout | default(''))) else ('WARNING (Not false)' if (__rhel_post_check_falconctl_stat.stat.exists | default(false)) else 'SKIPPED') }}"
      - "DISABLE Files Purge: {{ 'PURGED (' ~ (__rhel_post_check_removed_disable_files.results | default([]) | selectattr('changed', 'equalto', true) | list | length) ~ ' files)' if (__rhel_post_check_disable_files.files | default([]) | length > 0) else 'NONE' }}"
      - "=================================================="